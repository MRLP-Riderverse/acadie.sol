<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Shared identity metadata: use the same avatar for the desktop tab,
       homescreen install icon, and other PWA surfaces. -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#174b8e" />
  <title>ACADIE.SOL</title>
  <link rel="stylesheet" href="assets/site-colors.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", "Verdana", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(217,155,33,.20), transparent 17rem),
        linear-gradient(180deg, var(--paper) 0%, var(--bg) 58%, color-mix(in srgb, var(--bg) 80%, var(--gold)) 100%);
    }
    [data-theme="dark"] body { background: radial-gradient(circle at 20% 0%, rgba(217,155,33,.14), transparent 17rem), linear-gradient(180deg, color-mix(in srgb, var(--bg) 90%, #000) 0%, var(--bg) 68%, color-mix(in srgb, var(--bg) 60%, #000) 100%); }
    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--link-hover); }
    .phone-shell { width: min(430px, 100vw); min-height: 100svh; margin: 0 auto; padding: 12px 12px 92px; display: grid; align-content: start; gap: 12px; position: relative; }

    .surface { border: 1px solid var(--line); border-radius: 28px; background: color-mix(in srgb, var(--paper) 90%, transparent); box-shadow: 0 18px 42px var(--shadow); padding: 14px; }
    /* Landing page should read like a clean banner + action strip, not a product
       explainer. Keep the identity block short, then move the heavier framing into
       the footer bullets where it stays available without crowding the welcome. */
    .welcome-card { display: grid; gap: 10px; }
    .welcome-kicker { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 90%, transparent); color: var(--blue-deep); font-size: .70rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .welcome-card h1 { margin: 0; font-size: clamp(1.22rem, 6.3vw, 1.7rem); line-height: 1.02; letter-spacing: -.03em; color: var(--ink-strong); }
    .welcome-title-prefix { margin: 0; font-size: .88rem; line-height: 1.2; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .welcome-subtitle { max-width: 27ch; font-size: .84rem; line-height: 1.38; color: var(--muted); }
    .welcome-card p, .calendar-teaser p { margin: 0; color: var(--muted); line-height: 1.42; }
    /* Primary actions get their own surface so the landing copy reads as one block
       and navigation reads as a separate choice layer immediately below it. */
    .home-actions-card { display: grid; gap: 10px; }
    .home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .home-action { padding: 11px 12px; border-radius: 17px; background: var(--paper-soft); border: 1px solid var(--line); color: var(--blue-deep); font-weight: 900; text-align: center; text-decoration: none; }
    .home-action:hover { color: var(--link-hover); border-color: var(--line-strong); }

    .page-footer { padding: 16px 4px 0; color: var(--muted); font-size: .82rem; line-height: 1.45; border-top: 1px solid var(--line); margin-top: 4px; }
    .page-footer strong { color: var(--ink); }
    .page-footer p { margin: 0; }
    .page-footer ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
    .page-footer li { color: var(--muted); }

    @media (min-width: 760px) { .phone-shell { padding-top: 18px; } }
  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <main class="phone-shell">
    <section class="surface welcome-card" aria-labelledby="welcome-title">
      <span class="welcome-kicker" id="welcome-kicker">Community OS</span>
      <p class="welcome-title-prefix" id="welcome-title-prefix">Welcome to</p>
      <h1 id="welcome-title">Acadie.sol</h1>
      <p class="welcome-subtitle" id="welcome-subtitle">For Acadians, By Acadians.</p>
    </section>

    <section class="surface home-actions-card" aria-label="Primary home actions">
      <div class="home-actions" aria-label="Primary home actions">
        <a class="home-action" href="events.html" id="welcome-events-link">See events</a>
        <a class="home-action" href="directory.html" id="welcome-directory-link">Search places</a>
      </div>
    </section>

    <footer class="page-footer" id="about">
      <p id="about-copy"><strong>Built Locally.</strong></p>
      <ul id="about-points">
        <li>Acadian Pocket Companion</li>
        <li>Let’s Discover What’s Around Us!</li>
        <li>Let’s Connect!</li>
      </ul>
    </footer>
  </main>
  <script>
    // Home as OS launch surface: public data powers compact widgets; dock owns navigation.
    const HOME_COPY = {
      en: {
        menuDirectory: 'Full directory', menuAbout: 'About Acadie.sol', theme: 'Light ↔ dark mode', lang: 'Language: English',
        welcomeKicker: 'Community OS',
        welcomeTitlePrefix: 'Welcome to', welcomeTitle: 'Acadie.sol', welcomeSubtitle: 'For Acadians, By Acadians.',
        welcomeEvents: 'See events', welcomeDirectory: 'Search places', calendarTitle: 'Community calendar', calendarLink: 'Open calendar',
        about: '<strong>Built Locally.</strong>',
        aboutPoints: [
          'Acadian Pocket Companion',
          'Let’s Discover What’s Around Us!',
          'Let’s Connect!'
        ],
      },
      fr: {
        menuDirectory: 'Répertoire complet', menuAbout: 'À propos d’Acadie.sol', theme: 'Mode clair ↔ sombre', lang: 'Langue : Français',
        welcomeKicker: 'OS communautaire', welcomeTitlePrefix: 'Bienvenue à', welcomeTitle: 'Acadie.sol', welcomeSubtitle: 'Pour les Acadiens, par les Acadiens.',
        welcomeEvents: 'Voir les événements', welcomeDirectory: 'Chercher des lieux', calendarTitle: 'Calendrier communautaire', calendarLink: 'Ouvrir le calendrier',
        about: '<strong>Construit ici.</strong>',
        aboutPoints: [
          'Compagnon acadien de poche',
          'Découvrons ce qu’il y a autour de nous!',
          'Connectons-nous!'
        ],
      }
    };
    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }
    function copy() { return HOME_COPY[currentLang()] || HOME_COPY.en; }
    function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value; }
    function setHtml(id, value) { const el = document.getElementById(id); if (el) el.innerHTML = value; }
    function setList(id, items) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = (items || []).map(item => `<li>${item}</li>`).join('');
    }
    function updateMenuControls() {
      document.documentElement.dataset.lang = currentLang();
      const isDark = document.documentElement.dataset.theme === 'dark';
      const themeButton = document.getElementById('theme-toggle');
      if (themeButton) {
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeButton.textContent = isDark ? '☼' : '☾';
        themeButton.setAttribute('aria-label', label);
        themeButton.setAttribute('title', label);
      }
      const langButton = document.getElementById('lang-toggle');
      if (langButton) {
        const isFr = currentLang() === 'fr';
        langButton.setAttribute('aria-label', isFr ? 'Switch language to English' : 'Switch language to French');
        langButton.setAttribute('title', isFr ? 'Français actif — passer en anglais' : 'English active — switch to French');
      }
    }
    function applyTheme(theme) { document.documentElement.dataset.theme = theme; localStorage.setItem('acadie-theme', theme); updateMenuControls(); }
    const savedTheme = localStorage.getItem('acadie-theme');
    if (savedTheme) applyTheme(savedTheme);
    function updateStaticCopy() {
      const c = copy();
      updateMenuControls();
      setText('welcome-kicker', c.welcomeKicker);
      setText('welcome-title-prefix', c.welcomeTitlePrefix);
      setText('welcome-subtitle', c.welcomeSubtitle);
      setText('welcome-title', c.welcomeTitle);
      setText('welcome-events-link', c.welcomeEvents);
      setText('welcome-directory-link', c.welcomeDirectory);
      setHtml('about-copy', c.about);
      setList('about-points', c.aboutPoints);
    }
    window.addEventListener('acadie:languagechange', updateStaticCopy);
    document.documentElement.lang = currentLang();
    updateStaticCopy();
  </script>
</body>
</html>
