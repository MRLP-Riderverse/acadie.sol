<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#f5ede1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c1626" media="(prefers-color-scheme: dark)" />
  <title>ACADIE.SOL</title>
  <link rel="stylesheet" href="assets/site-colors.css" />
  <style>
    @font-face {
      font-family: "Pokemon GB";
      src: url("assets/fonts/PokemonGb-RAeo.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page-bg);
      font-family: "Trebuchet MS", "Verdana", "Segoe UI", sans-serif;
    }

    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--link-hover); }

    .phone-shell {
      width: min(430px, 100vw);
      min-height: 100svh;
      margin: 0 auto;
      padding: 12px 12px 92px;
      display: grid;
      align-content: start;
      gap: 12px;
      position: relative;
    }

    .surface {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: color-mix(in srgb, var(--paper) 90%, transparent);
      box-shadow: 0 18px 42px var(--shadow);
      padding: 14px;
      position: relative;
    }

    .welcome-card {
      display: grid;
      gap: 10px;
      padding: 20px;
      text-align: center;
      justify-items: center;
    }

    /* \"Community OS\" pill that bulges out of the bottom border of the welcome card */
    .welcome-label-pill {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 50%);
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink-strong);
      padding: 3px 10px;
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-family: "Pokemon GB", ui-monospace, monospace;
      z-index: 1;
      box-shadow: 0 2px 6px var(--shadow);
    }

    [data-theme="dark"] .welcome-label-pill {
      background: var(--button-bg);
      color: var(--button-fg);
      border-color: var(--button-border);
    }

    .welcome-card h1 {
      margin: 0;
      font-size: clamp(0.94rem, 5.2vw, 1.28rem);
      line-height: 1.08;
      letter-spacing: -.01em;
      color: var(--ink-strong);
      font-family: "Pokemon GB", ui-monospace, monospace;
    }

    .welcome-title-prefix {
      margin: 0;
      font-size: .64rem;
      line-height: 1.25;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-family: "Pokemon GB", ui-monospace, monospace;
    }

    .welcome-card p { margin: 0; color: var(--muted); line-height: 1.42; }

    .action-grid-card {
      padding: 0;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-tile {
      min-height: 84px;
      border-radius: 18px;
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink-strong);
      text-decoration: none;
      box-shadow: 0 12px 24px var(--shadow);
      padding: 10px 11px;
      display: grid;
      gap: 5px;
      align-content: center;
      justify-items: center;
      text-align: center;
    }

    .action-tile:hover {
      background: var(--paper-soft);
      color: var(--ink-strong);
    }

    [data-theme="dark"] .action-tile {
      background: var(--button-bg);
      color: var(--button-fg);
      border-color: var(--button-border);
    }

    [data-theme="dark"] .action-tile:hover {
      background: var(--button-bg-hover);
      color: var(--button-fg);
    }

    .action-icon {
      font-size: .96rem;
      line-height: 1;
      color: var(--gold);
    }

    .action-label {
      font-size: .82rem;
      font-weight: 900;
      line-height: 1.2;
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .action-meta {
      font-size: .68rem;
      line-height: 1.25;
      color: var(--muted);
    }

    /* Section divider — subtitle + ornament, plain text on page */
    .section-divider {
      margin: 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.38;
      letter-spacing: .02em;
      text-align: center;
      padding: 2px 0;
    }

    .section-divider-ornament {
      display: block;
      font-size: .88rem;
      letter-spacing: .08em;
      margin-top: 4px;
      padding-bottom: 18px;
    }

    .section-divider-line {
      display: block;
      width: 100%;
      height: 1px;
      background: color-mix(in srgb, var(--line) 50%, transparent);
      margin: 18px 0 0;
    }

    /* Media gallery — swipeable, no arrows, no dots */
    .media-gallery {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-soft) 88%, transparent);
      min-height: 180px;
    }

    .media-gallery-section {
      margin-top: 6px;
    }

    .media-gallery-track {
      display: flex;
      transition: transform 360ms ease;
      will-change: transform;
    }

    .media-gallery-slide {
      min-width: 100%;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .gallery-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
      padding: 20px;
      background: color-mix(in srgb, var(--ink) 4%, var(--paper-soft));
    }

    .gallery-placeholder-icon {
      font-size: 1.6rem;
      line-height: 1;
      opacity: .45;
    }

    .gallery-image {
      width: 100%;
      height: 100%;
      display: flex;
      margin: 0;
    }

    .gallery-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 14px 10px;
      background: linear-gradient(to top, rgba(0,0,0,.52) 0%, transparent 100%);
      color: #fff;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.3;
      pointer-events: none;
    }

    [data-theme="light"] .gallery-caption {
      background: linear-gradient(to top, rgba(12,22,38,.48) 0%, transparent 100%);
      color: var(--paper);
    }

    /* Updates feed — no visible container wrapper, compact rows */
    .updates-section {
      padding: 0;
    }

    .updates-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .updates-title {
      margin: 0;
      color: var(--ink-strong);
      font-size: .86rem;
      font-weight: 900;
    }

    .updates-pill {
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink-strong);
      padding: 4px 12px;
      font-size: .68rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 10px var(--shadow);
      transition: background 180ms ease;
    }

    .updates-pill:hover {
      background: var(--paper-soft);
    }

    .updates-header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .updates-pill[aria-pressed="true"],
    .updates-pill.active {
      background: var(--blue-deep);
      color: var(--acadian-yellow);
      border-color: var(--button-border);
    }

    [data-theme="dark"] .updates-pill {
      background: var(--button-bg);
      color: var(--button-fg);
      border-color: var(--button-border);
    }

    [data-theme="dark"] .updates-pill:hover {
      background: var(--button-bg-hover);
    }

    .update-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent);
      text-decoration: none;
      color: inherit;
    }

    .update-row:last-child { border-bottom: none; }
    .update-row:hover { color: var(--link); }

    .update-badge {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink-strong);
      padding: 2px 8px;
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    [data-theme="dark"] .update-badge {
      background: var(--button-bg);
      color: var(--button-fg);
      border-color: var(--button-border);
    }

    .update-content {
      flex: 1 1 auto;
      min-width: 0;
    }

    .update-name {
      color: var(--ink-strong);
      font-size: .8rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .update-desc {
      color: var(--muted);
      font-size: .68rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .update-time {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .64rem;
      white-space: nowrap;
    }

    /* Filter popover — matches directory's backdrop-blur pattern */
    .filter-popover {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(8, 18, 40, 0.24);
      backdrop-filter: blur(10px) saturate(1.05);
      -webkit-backdrop-filter: blur(10px) saturate(1.05);
    }
    .filter-popover[hidden] { display: none; }
    .filter-backdrop {
      position: absolute;
      inset: 0;
    }
    .filter-sheet {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      display: grid;
      align-content: start;
      gap: 9px;
      padding: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel-strong) 96%, transparent);
      box-shadow: 0 22px 48px rgba(5,13,27,0.42);
    }
    .filter-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
    }
    .filter-title button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
    }
    .filter-type-btn {
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      width: auto;
      min-height: 0;
      white-space: nowrap;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--button-fg);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .filter-type-btn:hover,
    .filter-type-btn[aria-pressed="true"],
    .filter-type-btn.active {
      background: var(--button-bg-hover);
      color: var(--button-fg);
    }

    @media (min-width: 760px) {
      .phone-shell { padding-top: 18px; }
    }
  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <main class="phone-shell">
    <section class="surface welcome-card" aria-labelledby="welcome-title">
      <span class="welcome-label-pill" id="welcome-label-pill">Community OS</span>
      <p class="welcome-title-prefix" id="welcome-title-prefix">Welcome to</p>
      <h1 id="welcome-title">⁜ Acadie.sol ⁜</h1>
    </section>

    <!-- Media gallery up top, 2×2 below -->
    <section class="media-gallery-section" aria-label="Media gallery">
      <div class="media-gallery" id="home-gallery">
        <div class="media-gallery-track" id="gallery-track"></div>
      </div>
    </section>

    <section class="action-grid-card" aria-label="Primary home actions">
      <div class="action-grid">
        <a class="action-tile" href="directory.html#browse" id="action-directory-link">
          <span class="action-icon" aria-hidden="true">⌕</span>
          <span class="action-label" id="action-directory-label">View Everyone</span>
          <span class="action-meta" id="action-directory-meta">Browse all listings.</span>
        </a>
        <a class="action-tile" href="events.html" id="action-events-link">
          <span class="action-icon" aria-hidden="true">◷</span>
          <span class="action-label" id="action-events-label">Events</span>
          <span class="action-meta" id="action-events-meta">See what's happening.</span>
        </a>
        <a class="action-tile" href="support.html" id="action-support-link">
          <span class="action-icon" aria-hidden="true">✦</span>
          <span class="action-label" id="action-support-label">Support</span>
          <span class="action-meta" id="action-support-meta">Help keep it going.</span>
        </a>
        <a class="action-tile" href="about-us.html" id="action-about-link">
          <span class="action-icon" aria-hidden="true">⁜</span>
          <span class="action-label" id="action-about-label">About Us</span>
          <span class="action-meta" id="action-about-meta">What this project is.</span>
        </a>
      </div>
    </section>

    <!-- Subtitle + ornament divider between 2×2 and updates -->
    <p class="section-divider" aria-hidden="true">
      <span id="divider-subtitle">For Acadians, By Acadians.</span>
      <span class="section-divider-ornament">✧❅✦❅✧</span>
      <span class="section-divider-line" aria-hidden="true"></span>
    </p>

    <section class="updates-section" id="home-updates" aria-label="Recent updates">
      <div class="updates-header">
        <h2 class="updates-title" id="updates-title">Updates</h2>
        <div class="updates-header-actions">
          <button class="updates-pill" id="updates-filter-btn" type="button">Filters</button>
          <a class="updates-pill" href="home-feed.html" id="updates-pill">View Updates ↗</a>
        </div>
      </div>
      <div id="updates-list"></div>

      <!-- Home updates filter popup: matches directory's filter-popover pattern. -->
      <div class="filter-popover" id="home-filter-popover" hidden>
        <div class="filter-backdrop" id="home-filter-backdrop" aria-hidden="true"></div>
        <div class="filter-sheet" role="dialog" aria-modal="true" aria-label="Update filters">
          <div class="filter-title">
            <span id="home-filter-title-label">Filters</span>
            <button id="home-filter-close" type="button" aria-label="Close filters">✕</button>
          </div>
          <div class="control-grid">
            <button class="search-action filter-type-btn" data-filter="recent" type="button">10 Recent</button>
            <button class="search-action filter-type-btn" data-filter="event" type="button">Events</button>
            <button class="search-action filter-type-btn" data-filter="entry" type="button">Entries</button>
            <button class="search-action filter-type-btn" data-filter="draft" type="button">Drafts</button>
            <button class="search-action filter-type-btn" data-filter="post" type="button" hidden>Posts</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const HOME_COPY = {
      en: {
        welcomeTitlePrefix: 'Welcome to',
        welcomeTitle: '\u205C Acadie.sol \u205C',
        welcomeSubtitle: 'For Acadians, By Acadians.',
        labelPill: 'Community OS',
        actions: {
          directory: { label: 'View Everyone', meta: 'Browse all listings.' },
          events: { label: 'Events', meta: 'See what\'s happening.' },
          support: { label: 'Support', meta: 'Help keep it going.' },
          about: { label: 'About Us', meta: 'What this project is.' }
        },
        updatesTitle: 'Updates',
        viewUpdates: 'View Updates ↗',
        filterBtn: 'Filters',
        filterTitle: 'Filters',
        filterRecent: '10 Recent',
        filterEvents: 'Events',
        filterEntries: 'Entries',
        filterDrafts: 'Drafts',
        filterPosts: 'Posts',
        galleryPlaceholder: index => `Gallery ${index + 1}`,
        types: { entry: 'Entry', event: 'Event', draft: 'Draft' },
        entryFallback: 'Entry details coming soon.',
        eventFallback: 'Event details coming soon.',
        timestampUnavailable: 'Timestamp unavailable',
        updatedNow: 'Updated just now',
        updatedAgo: mins => {
          const { value, unit } = relativeTimeBreakdown(mins);
          if (unit === 'min') return `${value} min ago`;
          if (unit === 'h') return `${value} h ago`;
          if (unit === 'd') return `${value} d ago`;
          return `${value} w ago`;
        },
        contexts: {
          draft: item => `${item.category || 'Draft'} · preview`,
          entry: item => `${item.category || 'Entry'} · ${item.area || 'Local'}`,
          event: item => `${item.statusLabel || 'Event'} · ${item.whenLabel || 'Date TBD'}`
        },
        emptyUpdates: 'No recent updates.'
      },
      fr: {
        welcomeTitlePrefix: 'Bienvenue à',
        welcomeTitle: '\u205C Acadie.sol \u205C',
        welcomeSubtitle: 'Pour les Acadiens, par les Acadiens.',
        labelPill: 'Système Communautaire',
        actions: {
          directory: { label: 'Voir tout le monde', meta: 'Parcourir toutes les fiches.' },
          events: { label: 'Événements', meta: 'Voir ce qui se passe.' },
          support: { label: 'Soutien', meta: 'Aider le projet à continuer.' },
          about: { label: 'À propos', meta: 'Ce qu\'est ce projet.' }
        },
        updatesTitle: 'Mises à jour',
        viewUpdates: 'Voir les mises à jour ↗',
        filterBtn: 'Filtres',
        filterTitle: 'Filtres',
        filterRecent: '10 récents',
        filterEvents: 'Événements',
        filterEntries: 'Entrées',
        filterDrafts: 'Brouillons',
        filterPosts: 'Publications',
        galleryPlaceholder: index => `Galerie ${index + 1}`,
        types: { entry: 'Entrée', event: 'Événement', draft: 'Brouillon' },
        entryFallback: 'Détails de l\'entrée à venir.',
        eventFallback: 'Détails de l\'événement à venir.',
        timestampUnavailable: 'Horodatage indisponible',
        updatedNow: 'Mis à jour à l\'instant',
        updatedAgo: mins => {
          const { value, unit } = relativeTimeBreakdown(mins);
          if (unit === 'min') return `Il y a ${value} min`;
          if (unit === 'h') return `Il y a ${value} h`;
          if (unit === 'd') return `Il y a ${value} j`;
          return `Il y a ${value} sem`;
        },
        contexts: {
          draft: item => `${item.category || 'Brouillon'} · aperçu`,
          entry: item => `${item.category || 'Entrée'} · ${item.area || 'Local'}`,
          event: item => `${item.statusLabel || 'Événement'} · ${item.whenLabel || 'Date à confirmer'}`
        },
        emptyUpdates: 'Aucune mise à jour récente.'
      }
    };

    const state = {
      items: [],
      filterMode: 'recent',
      galleryIndex: 0,
      galleryTouchStartX: 0,
      galleryTouchDeltaX: 0
    };

    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }

    function copy() {
      return HOME_COPY[currentLang()] || HOME_COPY.en;
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&')
        .replaceAll('<', '<')
        .replaceAll('>', '>')
        .replaceAll('"', '"')
        .replaceAll("'", '&#39;');
    }

    function localizedValue(value) {
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        return value[currentLang()] || value.en || Object.values(value).find(Boolean) || '';
      }
      return String(value || '');
    }

    function cleanSummary(value) {
      return String(value || '').replace(/\s+/g, ' ').trim();
    }

    function modifiedTs(item) {
      const numeric = Number(item?.source_modified_ts || 0);
      if (Number.isFinite(numeric) && numeric > 0) return numeric;
      const parsed = Date.parse(item?.source_modified_at || '');
      return Number.isFinite(parsed) ? Math.floor(parsed / 1000) : 0;
    }

    function relativeUpdatedLabel(ts) {
      const numeric = Number(ts || 0);
      if (!Number.isFinite(numeric) || numeric <= 0) return copy().timestampUnavailable;
      const minutes = Math.max(0, Math.round((Date.now() - numeric * 1000) / 60000));
      if (minutes < 1) return copy().updatedNow;
      return copy().updatedAgo(minutes);
    }

    function relativeTimeBreakdown(minutes) {
      // minutes → { value: N, unit: 'min'|'h'|'d'|'w' }
      if (minutes < 60) return { value: minutes, unit: 'min' };
      const hours = Math.round(minutes / 60);
      if (hours < 48) return { value: hours, unit: 'h' };
      const days = Math.round(hours / 24);
      if (days < 14) return { value: days, unit: 'd' };
      const weeks = Math.round(days / 7);
      return { value: weeks, unit: 'w' };
    }

    function formatEventWhen(value) {
      const date = new Date(value || '');
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat(currentLang(), {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }).format(date);
    }

    function normalizeEntry(item) {
      return {
        type: item.draft ? 'draft' : 'entry',
        id: item.slug,
        title: localizedValue(item.title_localized) || item.title,
        summary: localizedValue(item.description_localized) || cleanSummary(item.summary || item.description || item.notes) || copy().entryFallback,
        detailHref: item.draft ? `directory.html#entry-${encodeURIComponent(item.slug)}` : `entry.html#${encodeURIComponent(item.slug)}`,
        badge: item.draft ? copy().types.draft : copy().types.entry,
        statusLabel: item.draft ? copy().types.draft : copy().types.entry,
        category: cleanSummary(item.category || ''),
        area: cleanSummary(item.public_area || item.area || ''),
        source_modified_at: item.source_modified_at,
        source_modified_ts: modifiedTs(item)
      };
    }

    function normalizeEvent(item) {
      return {
        type: 'event',
        id: item.id,
        title: localizedValue(item.title) || item.name,
        summary: localizedValue(item.summary) || cleanSummary(item.name) || copy().eventFallback,
        detailHref: `events.html#event-${encodeURIComponent(item.id)}`,
        badge: copy().types.event,
        statusLabel: localizedValue({ en: item.computed_status || item.status || 'event', fr: item.computed_status === 'archived' ? 'archivé' : item.computed_status === 'active' ? 'actif' : 'événement' }),
        whenLabel: formatEventWhen(item.starts_at),
        category: 'event',
        area: cleanSummary(item.region_id || ''),
        source_modified_at: item.source_modified_at,
        source_modified_ts: modifiedTs(item)
      };
    }

    async function loadActivity() {
      const [directoryResponse, eventsResponse] = await Promise.all([
        fetch('assets/directory-data.json', { cache: 'no-store' }),
        fetch('assets/events-data.json', { cache: 'no-store' })
      ]);
      if (!directoryResponse.ok || !eventsResponse.ok) {
        throw new Error('Failed to load homepage activity payloads.');
      }
      const [directoryPayload, eventsPayload] = await Promise.all([
        directoryResponse.json(),
        eventsResponse.json()
      ]);
      const items = [
        ...(Array.isArray(directoryPayload.items) ? directoryPayload.items.map(normalizeEntry) : []),
        ...(Array.isArray(eventsPayload.items) ? eventsPayload.items.map(normalizeEvent) : [])
      ].sort((a, b) => b.source_modified_ts - a.source_modified_ts || String(a.title || '').localeCompare(String(b.title || '')));
      return { items };
    }

    /* --- Media Gallery Carousel (swipe-only, no arrows/dots) ---
       Data-driven: each entry is an image object { src, alt, caption }.
       To fill or reorder, edit GALLERY_IMAGES. Null slots render as
       placeholder cards so the count stays stable while assets fill in. */

    const GALLERY_IMAGES = [
      { src: 'assets/images/acadie-in-the-stars.jpg', alt: 'Acadie in the stars', caption: 'Acadie in the stars' },
      null,
      null
    ];

    function renderGallery() {
      const track = document.getElementById('gallery-track');
      if (!track) return;
      const c = copy();
      track.innerHTML = GALLERY_IMAGES.map((item, i) => {
        if (item) {
          return `
        <div class="media-gallery-slide">
          <picture class="gallery-image">
            <img src="${escapeHtml(item.src)}" alt="${escapeHtml(item.alt || '')}" loading="${i === 0 ? 'eager' : 'lazy'}" decoding="async" />
          </picture>
          ${item.caption ? `<div class="gallery-caption">${escapeHtml(item.caption)}</div>` : ''}
        </div>`;
        }
        return `
        <div class="media-gallery-slide">
          <div class="gallery-placeholder">
            <span class="gallery-placeholder-icon" aria-hidden="true"> ◒ </span>
            <span>${escapeHtml(c.galleryPlaceholder(i))}</span>
          </div>
        </div>`;
      }).join('');
      state.galleryIndex = 0;
      updateGallery();
      bindGalleryTouch();
    }

    function updateGallery() {
      const track = document.getElementById('gallery-track');
      if (!track) return;
      track.style.transform = `translateX(-${state.galleryIndex * 100}%)`;
    }

    function bindGalleryTouch() {
      const gallery = document.getElementById('home-gallery');
      if (!gallery || gallery.dataset.bound) return;
      gallery.dataset.bound = '1';
      gallery.addEventListener('touchstart', e => {
        state.galleryTouchStartX = e.touches[0]?.clientX || 0;
        state.galleryTouchDeltaX = 0;
      }, { passive: true });
      gallery.addEventListener('touchmove', e => {
        state.galleryTouchDeltaX = (e.touches[0]?.clientX || 0) - state.galleryTouchStartX;
      }, { passive: true });
      gallery.addEventListener('touchend', () => {
        if (Math.abs(state.galleryTouchDeltaX) > 28) {
          const next = state.galleryIndex + (state.galleryTouchDeltaX < 0 ? 1 : -1);
          state.galleryIndex = Math.max(0, Math.min(GALLERY_IMAGES.length - 1, next));
          updateGallery();
        }
        state.galleryTouchStartX = 0;
        state.galleryTouchDeltaX = 0;
      });
    }

    /* --- Updates feed (top-10 rows, scroll for more) --- */

    function renderUpdates(items) {
      const list = document.getElementById('updates-list');
      if (!list) return;
      const c = copy();
      if (!items.length) {
        list.innerHTML = `<p style="color:var(--muted);font-size:.78rem;padding:8px 0">${escapeHtml(c.emptyUpdates)}</p>`;
        return;
      }
      let filtered = items;
      if (state.filterMode === 'event') filtered = items.filter(i => i.type === 'event');
      else if (state.filterMode === 'entry') filtered = items.filter(i => i.type === 'entry');
      else if (state.filterMode === 'draft') filtered = items.filter(i => i.type === 'draft');
      else if (state.filterMode === 'post') filtered = items.filter(i => i.type === 'post');
      if (!filtered.length) {
        list.innerHTML = `<p style="color:var(--muted);font-size:.78rem;padding:8px 0">${escapeHtml(c.emptyUpdates)}</p>`;
        return;
      }
      const rows = filtered.slice(0, 10);
      list.innerHTML = rows.map(item => {
        const badge = escapeHtml(item.badge);
        const name = escapeHtml(item.title);
        const desc = escapeHtml(item.summary.substring(0, 60));
        const time = escapeHtml(relativeUpdatedLabel(item.source_modified_ts));
        return `<a class="update-row" href="${escapeHtml(item.detailHref)}">
          <span class="update-badge">${badge}</span>
          <span class="update-content">
            <span class="update-name">${name}</span>
            <span class="update-desc">${desc}</span>
          </span>
          <span class="update-time">${time}</span>
        </a>`;
      }).join('');
    }

    function updateStaticCopy() {
      const c = copy();
      document.title = 'ACADIE.SOL';
      setText('welcome-title-prefix', c.welcomeTitlePrefix);
      setText('welcome-title', c.welcomeTitle);
      setText('welcome-label-pill', c.labelPill);
      setText('divider-subtitle', c.welcomeSubtitle);
      setText('action-directory-label', c.actions.directory.label);
      setText('action-directory-meta', c.actions.directory.meta);
      setText('action-events-label', c.actions.events.label);
      setText('action-events-meta', c.actions.events.meta);
      setText('action-support-label', c.actions.support.label);
      setText('action-support-meta', c.actions.support.meta);
      setText('action-about-label', c.actions.about.label);
      setText('action-about-meta', c.actions.about.meta);
      setText('updates-title', c.updatesTitle);
      setText('updates-pill', c.viewUpdates);
      setText('updates-filter-btn', c.filterBtn);
      setText('home-filter-title-label', c.filterTitle);
      document.querySelectorAll('.filter-type-btn[data-filter="recent"]').forEach(b => b.textContent = c.filterRecent);
      document.querySelectorAll('.filter-type-btn[data-filter="event"]').forEach(b => b.textContent = c.filterEvents);
      document.querySelectorAll('.filter-type-btn[data-filter="entry"]').forEach(b => b.textContent = c.filterEntries);
      document.querySelectorAll('.filter-type-btn[data-filter="draft"]').forEach(b => b.textContent = c.filterDrafts);
      document.querySelectorAll('.filter-type-btn[data-filter="post"]').forEach(b => b.textContent = c.filterPosts);
      syncFilterBtns();
    }

    /* --- Home updates filter popup --- */

    function syncFilterBtns() {
      document.querySelectorAll('.filter-type-btn').forEach(btn => {
        const isActive = btn.dataset.filter === state.filterMode;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive);
      });
    }

    function openFilterPopover() {
      const el = document.getElementById('home-filter-popover');
      if (el) el.hidden = false;
    }

    function closeFilterPopover() {
      const el = document.getElementById('home-filter-popover');
      if (el) el.hidden = true;
    }

    function setFilterMode(mode) {
      state.filterMode = mode;
      closeFilterPopover();
      syncFilterBtns();
      if (state.items.length) renderUpdates(state.items);
    }

    document.getElementById('updates-filter-btn')?.addEventListener('click', openFilterPopover);
    document.getElementById('home-filter-close')?.addEventListener('click', closeFilterPopover);
    document.getElementById('home-filter-backdrop')?.addEventListener('click', closeFilterPopover);
    document.querySelectorAll('.filter-type-btn').forEach(btn => {
      btn.addEventListener('click', () => setFilterMode(btn.dataset.filter));
    });

    async function initHome() {
      renderGallery();
      try {
        const payload = await loadActivity();
        state.items = payload.items;
        renderUpdates(payload.items);
      } catch (error) {
        console.warn('Home updates unavailable:', error);
        const list = document.getElementById('updates-list');
        if (list) {
          list.innerHTML = `<p style="color:var(--muted);font-size:.78rem;padding:8px 0">${escapeHtml(copy().emptyUpdates)}</p>`;
        }
      }
    }

    window.addEventListener('acadie:languagechange', () => {
      updateStaticCopy();
      renderGallery();
      if (state.items.length) renderUpdates(state.items);
    });

    document.documentElement.lang = currentLang();
    updateStaticCopy();
    initHome();
  </script>
</body>
</html>
