<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Shared identity metadata: use the same avatar for the desktop tab,
       homescreen install icon, and other PWA surfaces. -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#f5ede1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c1626" media="(prefers-color-scheme: dark)" />
  <title>ACADIE.SOL</title>
  <link rel="stylesheet" href="assets/site-colors.css" />
  <style>
    @font-face {
      font-family: "Pokemon GB";
      src: url("assets/fonts/PokemonGb-RAeo.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page-bg);
      font-family: "Trebuchet MS", "Verdana", "Segoe UI", sans-serif;
    }

    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--link-hover); }

    /* Home stays a compact OS-style launch surface: one banner card, then one
       action block, then one live block. This keeps the first screen calm. */
    .phone-shell {
      width: min(430px, 100vw);
      min-height: 100svh;
      margin: 0 auto;
      padding: 12px 12px 92px;
      display: grid;
      align-content: start;
      gap: 12px;
      position: relative;
    }

    .surface {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: color-mix(in srgb, var(--paper) 90%, transparent);
      box-shadow: 0 18px 42px var(--shadow);
      padding: 14px;
    }

    /* Welcome banner carries the identity copy only. Routes and live progress move
       into their own blocks so the intro does not become a busy dashboard. */
    .welcome-card {
      display: grid;
      gap: 10px;
      padding: 20px;
      text-align: center;
      justify-items: center;
    }

    .welcome-card h1 {
      margin: 0;
      font-size: clamp(1.08rem, 5.8vw, 1.48rem);
      line-height: 1.08;
      letter-spacing: -.01em;
      color: var(--ink-strong);
      font-family: "Pokemon GB", ui-monospace, monospace;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .welcome-title-prefix {
      margin: 0;
      font-size: .76rem;
      line-height: 1.25;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-family: "Pokemon GB", ui-monospace, monospace;
    }

    .welcome-subtitle {
      max-width: 27ch;
      font-size: .82rem;
      line-height: 1.38;
      color: var(--muted);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .welcome-card p { margin: 0; color: var(--muted); line-height: 1.42; }

    .home-divider {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1;
      letter-spacing: .08em;
      text-align: center;
    }

    .welcome-meta-title {
      margin: 0;
      color: var(--ink);
      font-size: .86rem;
      line-height: 1.3;
    }

    .action-grid-card {
      padding: 0;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-tile {
      min-height: 84px;
      border-radius: 18px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--button-fg);
      text-decoration: none;
      box-shadow: 0 12px 24px var(--shadow);
      padding: 10px 11px;
      display: grid;
      gap: 5px;
      align-content: center;
      justify-items: center;
      text-align: center;
    }

    .action-tile:hover {
      background: var(--button-bg-hover);
      color: var(--button-fg);
    }

    .action-icon {
      font-size: .96rem;
      line-height: 1;
      color: var(--gold);
    }

    .action-label {
      font-size: .82rem;
      font-weight: 900;
      line-height: 1.2;
      color: var(--ink-strong);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .action-meta {
      font-size: .68rem;
      line-height: 1.25;
      color: var(--muted);
    }

    .live-card {
      padding: 0;
    }

    .carousel {
      display: grid;
      gap: 10px;
    }

    .carousel-window {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-soft) 88%, transparent);
      min-height: 178px;
    }

    .carousel-track {
      display: flex;
      transition: transform 360ms ease;
      will-change: transform;
    }

    .carousel-slide {
      min-width: 100%;
      padding: 14px 18px;
      display: grid;
      gap: 8px;
      color: inherit;
      text-decoration: none;
    }

    .carousel-slide:hover { color: inherit; }

    .slide-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .slide-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--button-fg);
      padding: 5px 9px;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      flex: 0 0 auto;
    }

    .slide-time {
      color: var(--muted);
      font-size: .74rem;
      white-space: nowrap;
    }

    .slide-title {
      margin: 0;
      color: var(--ink-strong);
      font-size: .92rem;
      line-height: 1.28;
    }

    .slide-summary {
      margin: 0;
      color: var(--ink);
      font-size: .76rem;
      line-height: 1.38;
    }

    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }

    .slide-context {
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.35;
    }

    .slide-cta {
      color: var(--link);
      font-size: .72rem;
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 3px;
      white-space: nowrap;
    }

    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-top: 14px;
    }

    .carousel-arrow {
      width: 34px;
      height: 34px;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      color: var(--ink-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 16px var(--shadow);
    }

    .carousel-arrow:hover {
      background: color-mix(in srgb, var(--paper) 96%, transparent);
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: color-mix(in srgb, var(--ink) 18%, transparent);
      cursor: pointer;
    }

    .carousel-dot[aria-current="true"] {
      background: var(--gold);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent);
    }

    .carousel-empty {
      padding: 16px;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.45;
    }

    @media (min-width: 760px) {
      .phone-shell { padding-top: 18px; }
    }
  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <main class="phone-shell">
    <section class="surface welcome-card" aria-labelledby="welcome-title">
      <p class="welcome-title-prefix" id="welcome-title-prefix">Welcome to</p>
      <h1 id="welcome-title">Acadie.sol ⭐️</h1>
      <p class="welcome-subtitle" id="welcome-subtitle">For Acadians, By Acadians.</p>
      <p class="home-divider" aria-hidden="true">✧❅✦❅✧</p>
      <p class="welcome-meta-title" id="about-copy">Community OS</p>
    </section>

    <section class="action-grid-card" aria-label="Primary home actions">
      <div class="action-grid">
        <a class="action-tile" href="directory.html#browse" id="action-directory-link">
          <span class="action-icon" aria-hidden="true">⌕</span>
          <span class="action-label" id="action-directory-label">Search Directory</span>
          <span class="action-meta" id="action-directory-meta">Browse all listings.</span>
        </a>
        <a class="action-tile" href="events.html" id="action-events-link">
          <span class="action-icon" aria-hidden="true">◷</span>
          <span class="action-label" id="action-events-label">Events</span>
          <span class="action-meta" id="action-events-meta">See what’s happening.</span>
        </a>
        <a class="action-tile" href="support.html" id="action-support-link">
          <span class="action-icon" aria-hidden="true">✦</span>
          <span class="action-label" id="action-support-label">Support</span>
          <span class="action-meta" id="action-support-meta">Help keep it going.</span>
        </a>
        <a class="action-tile" href="about-us.html" id="action-about-link">
          <span class="action-icon" aria-hidden="true">⊹</span>
          <span class="action-label" id="action-about-label">About Us</span>
          <span class="action-meta" id="action-about-meta">What this project is.</span>
        </a>
      </div>
    </section>

    <section class="live-card" aria-label="Homepage live feed">
      <div class="carousel" id="home-carousel">
        <div class="carousel-window">
          <div class="carousel-track" id="carousel-track" aria-live="polite"></div>
          <div class="carousel-empty" id="carousel-empty">Loading latest entries and events…</div>
        </div>
        <div class="carousel-controls" aria-label="Carousel controls">
          <button class="carousel-arrow prev" id="carousel-prev" type="button" aria-label="Previous slide">‹</button>
          <div class="carousel-dots" id="carousel-dots" aria-label="Live progress slides"></div>
          <button class="carousel-arrow next" id="carousel-next" type="button" aria-label="Next slide">›</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    // Home copy stays lean and route-focused. The live block is the only moving
    // homepage element and feeds into home-feed.html for the longer archive view.
    const HOME_COPY = {
      en: {
        menuDirectory: 'View Everyone',
        menuAbout: 'About us',
        welcomeTitlePrefix: 'Welcome to',
        welcomeTitle: 'Acadie.sol ⭐️',
        welcomeSubtitle: 'For Acadians, By Acadians.',
        about: 'Community OS',
        aboutPoints: [],
        actions: {
          directory: { label: 'Search Directory', meta: 'Browse all listings.' },
          events: { label: 'Events', meta: 'See what’s happening.' },
          support: { label: 'Support', meta: 'Help keep it going.' },
          about: { label: 'About Us', meta: 'What this project is.' }
        },
        liveTitle: 'Live progress',
        liveNote: 'Swipe or tap a dot to browse.',
        liveLoading: 'Loading latest progress…',
        liveStatus: count => `${count} recent additions in rotation`,
        liveFallback: 'No recent activity yet. New entries and events will appear here automatically.',
        openFeed: 'Open home feed ↗',
        slideAria: index => `Go to slide ${index}`,
        types: { entry: 'Entry', event: 'Event', draft: 'Draft' },
        entryFallback: 'Entry details coming soon.',
        eventFallback: 'Event details coming soon.',
        timestampUnavailable: 'Timestamp unavailable',
        updatedNow: 'Updated just now',
        updatedAgo: mins => mins < 60 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`,
        contexts: {
          draft: item => `${item.category || 'Draft'} · preview`,
          entry: item => `${item.category || 'Entry'} · ${item.area || 'Local'}`,
          event: item => `${item.statusLabel || 'Event'} · ${item.whenLabel || 'Date TBD'}`
        }
      },
      fr: {
        menuDirectory: 'Voir tout le monde',
        menuAbout: 'À propos de nous',
        welcomeTitlePrefix: 'Bienvenue à',
        welcomeTitle: 'Acadie.sol ⭐️',
        welcomeSubtitle: 'Pour les Acadiens, par les Acadiens.',
        about: 'Community OS',
        aboutPoints: [],
        actions: {
          directory: { label: 'Chercher le répertoire', meta: 'Parcourir toutes les fiches.' },
          events: { label: 'Événements', meta: 'Voir ce qui se passe.' },
          support: { label: 'Soutien', meta: 'Aider le projet à continuer.' },
          about: { label: 'À propos', meta: 'Ce qu’est ce projet.' }
        },
        liveTitle: 'Progrès en direct',
        liveNote: 'Glissez ou touchez un point.',
        liveLoading: 'Chargement des derniers progrès…',
        liveStatus: count => `${count} ajouts récents en rotation`,
        liveFallback: 'Aucune activité récente pour le moment. Les nouvelles entrées et événements apparaîtront ici automatiquement.',
        openFeed: 'Ouvrir le fil d’accueil ↗',
        slideAria: index => `Aller à la diapositive ${index}`,
        types: { entry: 'Entrée', event: 'Événement', draft: 'Brouillon' },
        entryFallback: 'Détails de l’entrée à venir.',
        eventFallback: 'Détails de l’événement à venir.',
        timestampUnavailable: 'Horodatage indisponible',
        updatedNow: 'Mis à jour à l’instant',
        updatedAgo: mins => mins < 60 ? `Il y a ${mins} min` : `Il y a ${Math.round(mins / 60)} h`,
        contexts: {
          draft: item => `${item.category || 'Brouillon'} · aperçu`,
          entry: item => `${item.category || 'Entrée'} · ${item.area || 'Local'}`,
          event: item => `${item.statusLabel || 'Événement'} · ${item.whenLabel || 'Date à confirmer'}`
        }
      }
    };

    const state = {
      items: [],
      carouselIndex: 0,
      carouselTimer: null,
      carouselBound: false,
      touchStartX: 0,
      touchDeltaX: 0
    };

    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }

    function copy() {
      return HOME_COPY[currentLang()] || HOME_COPY.en;
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function setHtml(id, value) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = value;
    }

    function setList(id, items) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = (items || []).map(item => `<li>${escapeHtml(item)}</li>`).join('');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function localizedValue(value) {
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        return value[currentLang()] || value.en || Object.values(value).find(Boolean) || '';
      }
      return String(value || '');
    }

    function cleanSummary(value) {
      return String(value || '').replace(/\s+/g, ' ').trim();
    }

    function modifiedTs(item) {
      const numeric = Number(item?.source_modified_ts || 0);
      if (Number.isFinite(numeric) && numeric > 0) return numeric;
      const parsed = Date.parse(item?.source_modified_at || '');
      return Number.isFinite(parsed) ? Math.floor(parsed / 1000) : 0;
    }

    function formatTimestamp(ts) {
      const numeric = Number(ts || 0);
      if (!Number.isFinite(numeric) || numeric <= 0) return copy().timestampUnavailable;
      return new Intl.DateTimeFormat(currentLang(), {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }).format(new Date(numeric * 1000));
    }

    function relativeUpdatedLabel(ts) {
      const numeric = Number(ts || 0);
      if (!Number.isFinite(numeric) || numeric <= 0) return copy().timestampUnavailable;
      const minutes = Math.max(0, Math.round((Date.now() - numeric * 1000) / 60000));
      if (minutes < 1) return copy().updatedNow;
      return copy().updatedAgo(minutes);
    }

    function formatEventWhen(value) {
      const date = new Date(value || '');
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat(currentLang(), {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }).format(date);
    }

    function normalizeEntry(item) {
      return {
        type: item.draft ? 'draft' : 'entry',
        id: item.slug,
        anchorId: `activity-entry-${item.slug}`,
        title: localizedValue(item.title_localized) || item.title,
        summary: localizedValue(item.description_localized) || cleanSummary(item.summary || item.description || item.notes) || copy().entryFallback,
        href: `home-feed.html#activity-entry-${encodeURIComponent(item.slug)}`,
        detailHref: item.draft ? `directory.html#entry-${encodeURIComponent(item.slug)}` : `entry.html#${encodeURIComponent(item.slug)}`,
        badge: item.draft ? copy().types.draft : copy().types.entry,
        statusLabel: item.draft ? copy().types.draft : copy().types.entry,
        category: cleanSummary(item.category || ''),
        area: cleanSummary(item.public_area || item.area || ''),
        source_modified_at: item.source_modified_at,
        source_modified_ts: modifiedTs(item)
      };
    }

    function normalizeEvent(item) {
      return {
        type: 'event',
        id: item.id,
        anchorId: `activity-event-${item.id}`,
        title: localizedValue(item.title) || item.name,
        summary: localizedValue(item.summary) || cleanSummary(item.name) || copy().eventFallback,
        href: `home-feed.html#activity-event-${encodeURIComponent(item.id)}`,
        detailHref: `events.html#event-${encodeURIComponent(item.id)}`,
        badge: copy().types.event,
        statusLabel: localizedValue({ en: item.computed_status || item.status || 'event', fr: item.computed_status === 'archived' ? 'archivé' : item.computed_status === 'active' ? 'actif' : 'événement' }),
        whenLabel: formatEventWhen(item.starts_at),
        category: 'event',
        area: cleanSummary(item.region_id || ''),
        source_modified_at: item.source_modified_at,
        source_modified_ts: modifiedTs(item)
      };
    }

    async function loadActivity() {
      const [directoryResponse, eventsResponse] = await Promise.all([
        fetch('assets/directory-data.json', { cache: 'no-store' }),
        fetch('assets/events-data.json', { cache: 'no-store' })
      ]);
      if (!directoryResponse.ok || !eventsResponse.ok) {
        throw new Error('Failed to load homepage activity payloads.');
      }
      const [directoryPayload, eventsPayload] = await Promise.all([
        directoryResponse.json(),
        eventsResponse.json()
      ]);
      let metaPayload = {};
      try {
        const metaResponse = await fetch('assets/site-meta.json', { cache: 'no-store' });
        if (metaResponse.ok) metaPayload = await metaResponse.json();
      } catch (error) {
        console.warn('Homepage site meta unavailable:', error);
      }
      const items = [
        ...(Array.isArray(directoryPayload.items) ? directoryPayload.items.map(normalizeEntry) : []),
        ...(Array.isArray(eventsPayload.items) ? eventsPayload.items.map(normalizeEvent) : [])
      ].sort((a, b) => b.source_modified_ts - a.source_modified_ts || String(a.title || '').localeCompare(String(b.title || '')));
      return { items, meta: metaPayload || {} };
    }

    function slideContext(item) {
      if (item.type === 'draft') return copy().contexts.draft(item);
      if (item.type === 'entry') return copy().contexts.entry(item);
      return copy().contexts.event(item);
    }

    function renderCarousel(items) {
      const track = document.getElementById('carousel-track');
      const dots = document.getElementById('carousel-dots');
      const empty = document.getElementById('carousel-empty');
      if (!track || !dots || !empty) return;

      if (!items.length) {
        track.innerHTML = '';
        dots.innerHTML = '';
        empty.hidden = false;
        empty.textContent = copy().liveFallback;
        stopCarousel();
        return;
      }

      empty.hidden = true;
      track.innerHTML = items.map(item => `
        <a class="carousel-slide" href="${escapeHtml(item.href)}" data-anchor="${escapeHtml(item.anchorId)}">
          <div class="slide-top">
            <span class="slide-badge">${escapeHtml(item.badge)}</span>
            <span class="slide-time">${escapeHtml(formatTimestamp(item.source_modified_ts))}</span>
          </div>
          <h3 class="slide-title">${escapeHtml(item.title)}</h3>
          <p class="slide-summary">${escapeHtml(item.summary)}</p>
          <div class="slide-footer">
            <span class="slide-context">${escapeHtml(slideContext(item))}</span>
            <span class="slide-cta">${escapeHtml(copy().openFeed)}</span>
          </div>
        </a>
      `).join('');

      dots.innerHTML = items.map((item, index) => `
        <button class="carousel-dot" type="button" aria-label="${escapeHtml(copy().slideAria(index + 1))}" data-index="${index}" ${index === 0 ? 'aria-current="true"' : ''}></button>
      `).join('');

      dots.querySelectorAll('.carousel-dot').forEach(button => {
        button.addEventListener('click', () => {
          moveToSlide(Number(button.dataset.index || 0));
          restartCarousel();
        });
      });

      if (!state.carouselBound) {
        const carousel = document.getElementById('home-carousel');
        const prev = document.getElementById('carousel-prev');
        const next = document.getElementById('carousel-next');
        prev?.addEventListener('click', () => {
          moveToSlide(state.carouselIndex - 1);
          restartCarousel();
        });
        next?.addEventListener('click', () => {
          moveToSlide(state.carouselIndex + 1);
          restartCarousel();
        });
        carousel?.addEventListener('mouseenter', stopCarousel);
        carousel?.addEventListener('mouseleave', startCarousel);
        carousel?.addEventListener('focusin', stopCarousel);
        carousel?.addEventListener('focusout', startCarousel);
        carousel?.addEventListener('touchstart', event => {
          state.touchStartX = event.touches[0]?.clientX || 0;
          state.touchDeltaX = 0;
          stopCarousel();
        }, { passive: true });
        carousel?.addEventListener('touchmove', event => {
          state.touchDeltaX = (event.touches[0]?.clientX || 0) - state.touchStartX;
        }, { passive: true });
        carousel?.addEventListener('touchend', () => {
          if (Math.abs(state.touchDeltaX) > 28) {
            moveToSlide(state.carouselIndex + (state.touchDeltaX < 0 ? 1 : -1));
          }
          state.touchStartX = 0;
          state.touchDeltaX = 0;
          startCarousel();
        });
        state.carouselBound = true;
      }

      state.items = items;
      state.carouselIndex = 0;
      updateCarousel();
      restartCarousel();
    }

    function updateCarousel() {
      const track = document.getElementById('carousel-track');
      if (!track || !state.items.length) return;
      const index = ((state.carouselIndex % state.items.length) + state.items.length) % state.items.length;
      state.carouselIndex = index;
      track.style.transform = `translateX(-${index * 100}%)`;
      document.querySelectorAll('.carousel-dot').forEach((dot, dotIndex) => {
        if (dotIndex === index) dot.setAttribute('aria-current', 'true');
        else dot.removeAttribute('aria-current');
      });
    }

    function moveToSlide(index) {
      state.carouselIndex = index;
      updateCarousel();
    }

    function stopCarousel() {
      if (state.carouselTimer) {
        clearInterval(state.carouselTimer);
        state.carouselTimer = null;
      }
    }

    function startCarousel() {
      if (!state.items.length || state.carouselTimer) return;
      state.carouselTimer = setInterval(() => {
        state.carouselIndex = (state.carouselIndex + 1) % state.items.length;
        updateCarousel();
      }, 4000);
    }

    function restartCarousel() {
      stopCarousel();
      startCarousel();
    }

    function updateMenuControls() {
      document.documentElement.dataset.lang = currentLang();
      const isDark = document.documentElement.dataset.theme === 'dark';
      const themeButton = document.getElementById('theme-toggle');
      if (themeButton) {
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeButton.textContent = isDark ? '☼' : '☾';
        themeButton.setAttribute('aria-label', label);
        themeButton.setAttribute('title', label);
      }
      const langButton = document.getElementById('lang-toggle');
      if (langButton) {
        const isFr = currentLang() === 'fr';
        langButton.setAttribute('aria-label', isFr ? 'Switch language to English' : 'Switch language to French');
        langButton.setAttribute('title', isFr ? 'Français actif — passer en anglais' : 'English active — switch to French');
      }
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('acadie-theme', theme);
      updateMenuControls();
    }

    const savedTheme = localStorage.getItem('acadie-theme');
    if (savedTheme) applyTheme(savedTheme);

    function updateStaticCopy() {
      const c = copy();
      document.title = 'ACADIE.SOL';
      updateMenuControls();
      setText('welcome-title-prefix', c.welcomeTitlePrefix);
      setText('welcome-subtitle', c.welcomeSubtitle);
      setText('welcome-title', c.welcomeTitle);
      setHtml('about-copy', c.about);
      setList('about-points', c.aboutPoints);
      setText('action-directory-label', c.actions.directory.label);
      setText('action-directory-meta', c.actions.directory.meta);
      setText('action-events-label', c.actions.events.label);
      setText('action-events-meta', c.actions.events.meta);
      setText('action-support-label', c.actions.support.label);
      setText('action-support-meta', c.actions.support.meta);
      setText('action-about-label', c.actions.about.label);
      setText('action-about-meta', c.actions.about.meta);
      setText('live-title', c.liveTitle);
      setText('live-note', c.liveNote);
      if (!state.items.length) setText('live-status-copy', c.liveLoading);
    }

    async function initHomeLive() {
      try {
        const payload = await loadActivity();
        const slides = payload.items.slice(0, 3);
        renderCarousel(slides);
        setText('live-status-copy', copy().liveStatus(slides.length || payload.items.length));
        const latestTs = Number(payload.meta.latest_source_modified_ts || slides[0]?.source_modified_ts || 0);
        if (latestTs > 0) {
          setText('live-status-copy', `${copy().liveStatus(slides.length || payload.items.length)} · ${relativeUpdatedLabel(latestTs)}`);
        }
      } catch (error) {
        console.warn('Home live carousel unavailable:', error);
        const empty = document.getElementById('carousel-empty');
        if (empty) {
          empty.hidden = false;
          empty.textContent = copy().liveFallback;
        }
        setText('live-status-copy', copy().timestampUnavailable);
      }
    }

    window.addEventListener('acadie:languagechange', () => {
      updateStaticCopy();
      initHomeLive();
    });

    document.documentElement.lang = currentLang();
    updateStaticCopy();
    initHomeLive();
  </script>
</body>
</html>
