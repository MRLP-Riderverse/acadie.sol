<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Shared identity metadata: use the same avatar for the desktop tab,
       homescreen install icon, and other PWA surfaces. -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#174b8e" />
  <title>ACADIE.SOL</title>
  <link rel="stylesheet" href="assets/site-colors.css" />
  <style>
    @font-face {
      font-family: "Pokemon GB";
      src: url("assets/fonts/PokemonGb-RAeo.ttf") format("truetype");
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page-bg);
      font-family: "Trebuchet MS", "Verdana", "Segoe UI", sans-serif;
    }
    [data-theme="dark"] body { background: var(--page-bg); }
    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--link-hover); }
    .phone-shell { width: min(430px, 100vw); min-height: 100svh; margin: 0 auto; padding: 12px 12px 92px; display: grid; align-content: start; gap: 12px; position: relative; }

    .surface { border: 1px solid var(--line); border-radius: 28px; background: color-mix(in srgb, var(--paper) 90%, transparent); box-shadow: 0 18px 42px var(--shadow); padding: 14px; }
    /* Landing page should read like a clean banner + action strip, not a product
       explainer. Keep the identity block short, then move the heavier framing into
       the footer bullets where it stays available without crowding the welcome. */
    .welcome-card { display: grid; gap: 10px; padding: 20px; text-align: center; justify-items: center; }
    .welcome-card h1 { margin: 0; font-size: clamp(1.08rem, 5.8vw, 1.48rem); line-height: 1.08; letter-spacing: -.01em; color: var(--ink-strong); font-family: "Pokemon GB", ui-monospace, monospace; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .welcome-title-prefix { margin: 0; font-size: .76rem; line-height: 1.25; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: "Pokemon GB", ui-monospace, monospace; }
    .welcome-subtitle { max-width: 27ch; font-size: .82rem; line-height: 1.38; color: var(--muted); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .welcome-card p { margin: 0; color: var(--muted); line-height: 1.42; }
    /* Shared divider rune keeps the home banner and dock-near routes tied together
       without reintroducing container chrome. */
    .home-divider { margin: 2px 0 0; color: var(--muted); font-size: .9rem; line-height: 1; letter-spacing: .08em; text-align: center; }
    .welcome-meta { width: calc(100% - 40px); margin-top: 8px; padding: 14px 20px 0; display: grid; gap: 8px; justify-items: center; }
    .welcome-meta-title { margin: 0; color: var(--ink); font-size: .86rem; line-height: 1.3; }
    .welcome-meta-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .welcome-meta-list li { color: var(--muted); }
    /* Primary routes now live inside the welcome block under the community notes,
       so the whole homepage reads as one stitched banner instead of split top/bottom zones. */
    .home-actions { display: grid; justify-items: center; gap: 8px; margin-top: 6px; }
    .home-action { color: var(--link); font-weight: 900; font-size: .86rem; text-align: center; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .home-action:hover { color: var(--link-hover); }

    @media (min-width: 760px) { .phone-shell { padding-top: 18px; } }
  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <main class="phone-shell">
    <section class="surface welcome-card" aria-labelledby="welcome-title">
      <p class="welcome-title-prefix" id="welcome-title-prefix">Welcome to</p>
      <h1 id="welcome-title">Acadie.sol</h1>
      <p class="welcome-subtitle" id="welcome-subtitle">By Acadians, For Acadians.</p>
      <div class="welcome-meta" aria-labelledby="about-copy">
        <p class="home-divider" aria-hidden="true">✧❅✦❅✧</p>
        <p class="welcome-meta-title" id="about-copy"><strong>Built Locally.</strong></p>
        <ul class="welcome-meta-list" id="about-points">
          <li>Community OS</li>
          <li>Acadian Pocket Companion</li>
          <li>Let’s Discover What’s Around Us!</li>
          <li>Let’s Connect!</li>
        </ul>
        <div class="home-actions" aria-label="Primary home actions">
          <a class="home-action" href="events.html" id="welcome-events-link">Events</a>
          <a class="home-action" href="directory.html" id="welcome-directory-link">View Everyone</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    // Home as OS launch surface: keep the copy lean and the routes raw/direct.
    const HOME_COPY = {
      en: {
        menuDirectory: 'View Everyone', menuAbout: 'About us', theme: 'Light ↔ dark mode', lang: 'Language: English',
        welcomeTitlePrefix: 'Welcome to', welcomeTitle: 'Acadie.sol', welcomeSubtitle: 'By Acadians, For Acadians.',
        welcomeEvents: 'Events', welcomeDirectory: 'View Everyone',
        about: '<strong>Built Locally.</strong>',
        aboutPoints: [
          'Community OS',
          'Acadian Pocket Companion',
          'Let’s Discover What’s Around Us!',
          'Let’s Connect!'
        ],
      },
      fr: {
        menuDirectory: 'Voir tout le monde', menuAbout: 'À propos de nous', theme: 'Mode clair ↔ sombre', lang: 'Langue : Français',
        welcomeTitlePrefix: 'Bienvenue à', welcomeTitle: 'Acadie.sol', welcomeSubtitle: 'Pour les Acadiens, par les Acadiens.',
        welcomeEvents: 'Événements', welcomeDirectory: 'Voir tout le monde',
        about: '<strong>Construit ici.</strong>',
        aboutPoints: [
          'OS communautaire',
          'Compagnon acadien de poche',
          'Découvrons ce qu’il y a autour de nous!',
          'Connectons-nous!'
        ],
      }
    };

    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }
    function copy() { return HOME_COPY[currentLang()] || HOME_COPY.en; }
    function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value; }
    function setHtml(id, value) { const el = document.getElementById(id); if (el) el.innerHTML = value; }
    function setList(id, items) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = (items || []).map(item => `<li>${item}</li>`).join('');
    }
    function updateMenuControls() {
      document.documentElement.dataset.lang = currentLang();
      const isDark = document.documentElement.dataset.theme === 'dark';
      const themeButton = document.getElementById('theme-toggle');
      if (themeButton) {
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeButton.textContent = isDark ? '☼' : '☾';
        themeButton.setAttribute('aria-label', label);
        themeButton.setAttribute('title', label);
      }
      const langButton = document.getElementById('lang-toggle');
      if (langButton) {
        const isFr = currentLang() === 'fr';
        langButton.setAttribute('aria-label', isFr ? 'Switch language to English' : 'Switch language to French');
        langButton.setAttribute('title', isFr ? 'Français actif — passer en anglais' : 'English active — switch to French');
      }
    }
    function applyTheme(theme) { document.documentElement.dataset.theme = theme; localStorage.setItem('acadie-theme', theme); updateMenuControls(); }
    const savedTheme = localStorage.getItem('acadie-theme');
    if (savedTheme) applyTheme(savedTheme);
    function updateStaticCopy() {
      const c = copy();
      updateMenuControls();
      setText('welcome-title-prefix', c.welcomeTitlePrefix);
      setText('welcome-subtitle', c.welcomeSubtitle);
      setText('welcome-title', c.welcomeTitle);
      setText('welcome-events-link', c.welcomeEvents);
      setText('welcome-directory-link', c.welcomeDirectory);
      setHtml('about-copy', c.about);
      setList('about-points', c.aboutPoints);
    }
    window.addEventListener('acadie:languagechange', () => {
      updateStaticCopy();
    });
    document.documentElement.lang = currentLang();
    updateStaticCopy();
  </script>
</body>
</html>
