<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23174b8e'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34'%3E🔥%3C/text%3E%3C/svg%3E" />
  <title>ACADIE.SOL Events</title>
  <style>
    :root {
      --page-bg: #121212;
      --blue: #174b8e;
      --blue-deep: #0d2f5e;
      --gold: #f2c84b;
      --red: #bf4a4f;
      --text: #f8f5ea;
      --muted: rgba(248, 245, 234, 0.74);
      --line: rgba(248, 245, 234, 0.18);
      --card: rgba(16, 53, 102, 0.84);
      --shadow: rgba(5, 13, 27, 0.30);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(40,114,198,.28), transparent 26rem),
        radial-gradient(circle at 96% 6%, rgba(242,200,75,.14), transparent 22rem),
        linear-gradient(180deg, #1b1b1b 0%, var(--page-bg) 50%, #0e0e0e 100%);
    }
    a { color: inherit; text-underline-offset: 3px; }
    .wrap { width: min(860px, calc(100vw - 24px)); margin: 0 auto; padding: 18px 0 36px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .brand { color: var(--gold); font-weight: 900; letter-spacing: .11em; text-decoration: none; font-size: .9rem; }
    .nav { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; background: rgba(255,255,255,.06); color: var(--text); text-decoration: none; font-size: .8rem; }
    .pill:hover, button.pill.active { border-color: var(--gold); background: rgba(242,200,75,.95); color: #302400; }
    button.pill { cursor: pointer; font: inherit; }
    .hero {
      display: grid;
      gap: 9px;
      margin-bottom: 14px;
      padding: clamp(16px, 4vw, 26px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(33,98,177,.64), var(--card));
      box-shadow: 0 18px 42px var(--shadow);
    }
    .eyebrow { color: var(--gold); text-transform: uppercase; letter-spacing: .14em; font-size: .66rem; font-weight: 900; }
    h1 { margin: 0; font-size: clamp(1.8rem, 8vw, 3rem); line-height: 1; }
    .lede { color: var(--muted); max-width: 58ch; line-height: 1.42; margin: 0; font-size: .92rem; }
    .filters { display: flex; gap: 7px; flex-wrap: wrap; margin: 11px 0 15px; }
    .events-list { display: grid; gap: 12px; }
    .time-group { display: grid; gap: 8px; }
    .time-heading { margin: 5px 0 0; color: var(--gold); font-size: .72rem; letter-spacing: .13em; text-transform: uppercase; }
    .event-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 11px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(33,98,177,.56), rgba(16,53,102,.86));
      box-shadow: 0 16px 36px var(--shadow);
    }
    .date-badge {
      min-width: 52px;
      align-self: start;
      display: grid;
      gap: 1px;
      justify-items: center;
      padding: 8px 7px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(180deg, rgba(191,74,79,.98), rgba(126,35,42,.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
      font-weight: 900;
    }
    .date-badge small { font-size: .56rem; opacity: .82; text-transform: uppercase; letter-spacing: .08em; }
    .date-badge b { font-size: 1.16rem; line-height: 1; }
    .event-main { display: grid; gap: 8px; min-width: 0; }
    .event-main h2 { margin: 0; font-size: clamp(1.02rem, 4vw, 1.32rem); line-height: 1.1; }
    .event-subline, .description, .side-note { color: var(--muted); line-height: 1.38; }
    .event-subline { display: flex; gap: 6px; flex-wrap: wrap; font-size: .8rem; }
    .description { margin: 0; font-size: .86rem; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 4px 7px; background: rgba(255,255,255,.07); }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .action { border: 1px solid var(--line); border-radius: 11px; padding: 8px 9px; background: rgba(255,255,255,.07); text-decoration: none; color: var(--text); font-size: .82rem; }
    .action.primary { background: rgba(242,200,75,.95); border-color: var(--gold); color: #302400; font-weight: 800; }
    .empty { padding: 18px; border: 1px solid var(--line); border-radius: 17px; color: var(--muted); background: rgba(255,255,255,.05); }
    @media (max-width: 620px) {
      .wrap { width: min(100vw - 18px, 860px); padding-top: 12px; }
      .top { align-items: flex-start; }
      .nav { gap: 5px; }
      .hero { border-radius: 18px; }
      .event-card { grid-template-columns: auto 1fr; border-radius: 16px; }
      .date-badge { width: 52px; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="index.html">ACADIE.SOL</a>
      <nav class="nav" aria-label="Primary">
        <a class="pill" href="directory.html#search">Find places</a>
        <a class="pill" href="index.html">Home</a>
      </nav>
    </header>

    <section class="hero">
      <div class="eyebrow">Community calendar</div>
      <h1>What’s happening</h1>
      <p class="lede">Shows, meals, gatherings, pop-ups, and community dates around Acadie. Event cards link back to their host places so the calendar and directory stay connected.</p>
    </section>

    <div class="filters" aria-label="Event filters">
      <button class="pill active" data-filter="upcoming">Upcoming</button>
      <button class="pill" data-filter="all">All</button>
      <button class="pill" data-filter="archive">Archive</button>
    </div>

    <main id="events" class="events-list" aria-live="polite"></main>
  </div>

  <script>
    // Events renderer: event cards are the primary public experience. Related
    // place/location context is visually separated and repeated inside cards only
    // where it helps the reader understand the event quickly.
    const state = { events: [], entries: [], locations: [], filter: 'upcoming' };
    function escapeHtml(str) { return String(str || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;'); }
    function text(value) { return value && typeof value === 'object' ? (value.en || value.fr || value.shiac || '') : (value || ''); }
    function publicTitle(event) { return String(text(event.title) || event.name || '').replace(/\s+Placeholder\b/i, ' Preview'); }
    function publicSummary(event) {
      const raw = String(text(event.summary) || 'Details coming soon.');
      return /placeholder|non-public/i.test(raw) ? 'Preview listing while the public calendar format is being shaped.' : raw;
    }
    function parseDate(value) { const date = new Date(value || ''); return Number.isNaN(date.getTime()) ? null : date; }
    function dateParts(value) {
      const date = parseDate(value);
      if (!date) return { month: 'TBD', day: '', time: 'Time TBD', full: 'Date TBD' };
      return {
        month: new Intl.DateTimeFormat(undefined, { month: 'short' }).format(date),
        day: new Intl.DateTimeFormat(undefined, { day: 'numeric' }).format(date),
        time: new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }).format(date),
        full: new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(date)
      };
    }
    function placeEntry(id) { return state.entries.find(item => item.slug === id); }
    function placeLocation(id) { return state.locations.find(item => item.id === id); }
    function entryName(id) { return placeEntry(id)?.title || id; }
    function locationName(id) { return placeLocation(id)?.name || 'Location TBD'; }
    function locationSummary(id) { return text(placeLocation(id)?.summary) || ''; }
    function isArchived(event) { return event.computed_status === 'archived' || event.status === 'archived'; }
    function eventMatches(event) {
      if (state.filter === 'all') return true;
      if (state.filter === 'archive') return isArchived(event);
      return !isArchived(event);
    }
    function groupLabel(event) {
      const start = parseDate(event.starts_at);
      if (!start) return 'Date to confirm';
      const now = new Date();
      const diffDays = Math.floor((start.setHours(0,0,0,0) - new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()) / 86400000);
      if (diffDays <= 7) return 'Next up';
      if (diffDays <= 31) return 'Coming up';
      return 'Later';
    }
    function renderEvent(event) {
      const parts = dateParts(event.starts_at);
      const hosts = (event.host_entry_ids || []).map(id => `<a href="directory.html#entry-${escapeHtml(id)}">${escapeHtml(entryName(id))}</a>`).join(', ');
      const icsHref = event.starts_at ? `assets/calendar/${encodeURIComponent(event.id)}.ics` : '';
      return `<article class="event-card" id="event-${escapeHtml(event.id)}">
        <div class="date-badge"><small>${escapeHtml(parts.month)}</small><b>${escapeHtml(parts.day)}</b></div>
        <div class="event-main">
          <div>
            <h2>${escapeHtml(publicTitle(event))}</h2>
            <div class="event-subline">
              <span>${escapeHtml(parts.full)}</span>
              ${hosts ? `<span>Hosted by ${hosts}</span>` : ''}
              <span>${escapeHtml(locationName(event.location_id))}</span>
            </div>
          </div>
          <p class="description">${escapeHtml(publicSummary(event))}</p>
          <div class="actions">
            ${icsHref ? `<a class="action primary" href="${icsHref}" download>Add to calendar</a>` : ''}
            ${event.host_entry_ids?.[0] ? `<a class="action" href="directory.html#entry-${escapeHtml(event.host_entry_ids[0])}">View host</a>` : ''}
          </div>
        </div>
      </article>`;
    }
    function renderEvents() {
      const root = document.getElementById('events');
      const events = state.events.filter(eventMatches).sort((a, b) => String(a.starts_at || '').localeCompare(String(b.starts_at || '')));
      if (!events.length) {
        root.innerHTML = '<div class="empty">No matching events yet.</div>';
        return;
      }
      const groups = new Map();
      events.forEach(event => {
        const label = state.filter === 'archive' ? 'Archive' : groupLabel(event);
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(event);
      });
      root.innerHTML = [...groups.entries()].map(([label, items]) => `<section class="time-group"><h2 class="time-heading">${escapeHtml(label)}</h2>${items.map(renderEvent).join('')}</section>`).join('');
    }
    function bindFilters() {
      document.querySelectorAll('[data-filter]').forEach(button => {
        button.addEventListener('click', () => {
          state.filter = button.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach(btn => btn.classList.toggle('active', btn === button));
          renderEvents();
        });
      });
    }
    Promise.all([
      fetch('assets/events-data.json', { cache: 'no-store' }).then(res => res.json()),
      fetch('assets/directory-data.json', { cache: 'no-store' }).then(res => res.json()),
      fetch('assets/locations-data.json', { cache: 'no-store' }).then(res => res.json())
    ]).then(([events, directory, locations]) => {
      state.events = events.items || [];
      state.entries = directory.items || [];
      state.locations = locations.items || [];
      bindFilters();
      renderEvents();
    }).catch(error => {
      document.getElementById('events').innerHTML = `<div class="empty">Events failed to load: ${escapeHtml(error.message)}</div>`;
      console.error(error);
    });
  </script>
</body>
</html>
