<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Shared identity metadata: use the same avatar for the desktop tab,
       homescreen install icon, and other PWA surfaces. -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#f5ede1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c1626" media="(prefers-color-scheme: dark)" />
  <title>ACADIE.SOL Events</title>
  <link rel="stylesheet" href="assets/site-colors.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      color: var(--ink);
      background: var(--page-bg);
    }
    a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { color: var(--link-hover); }
    .wrap { width: min(860px, calc(100vw - 24px)); margin: 0 auto; padding: 18px 0 36px; }
    .top { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 14px; }
    .nav { display: none; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; background: color-mix(in srgb, var(--paper) 78%, transparent); color: var(--ink); text-decoration: none; font-size: .8rem; }
    .pill:hover, button.pill.active { border-color: var(--blue-deep); background: var(--blue-deep); color: var(--blue-ink); }
    button.pill { cursor: pointer; font: inherit; }
    .hero {
      display: grid;
      gap: 9px;
      margin-bottom: 14px;
      padding: clamp(16px, 4vw, 26px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: color-mix(in srgb, var(--paper) 86%, transparent);
      box-shadow: 0 14px 32px var(--shadow);
    }
    .eyebrow { color: var(--gold); text-transform: uppercase; letter-spacing: .14em; font-size: .66rem; font-weight: 900; }
    h1 { margin: 0; font-size: clamp(1.8rem, 8vw, 3rem); line-height: 1; }
    .lede { color: var(--muted); max-width: 58ch; line-height: 1.42; margin: 0; font-size: .92rem; }
    .filters { display: flex; gap: 7px; flex-wrap: wrap; margin: 11px 0 15px; }
    .events-list { display: grid; gap: 12px; }
    .time-group { display: grid; gap: 8px; }
    .time-heading { margin: 5px 0 0; color: var(--gold); font-size: .72rem; letter-spacing: .13em; text-transform: uppercase; }
    /* Event cards borrow the expandable quick-card language from directory.html:
       the summary is the default browse surface, the body holds actions/details. */
    .event-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      color: var(--ink);
      box-shadow: 0 14px 32px var(--shadow);
      overflow: clip;
    }
    .event-card > summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 11px;
      align-items: start;
      padding: 12px;
    }
    .event-card > summary::-webkit-details-marker { display: none; }
    .date-badge {
      min-width: 52px;
      align-self: start;
      display: grid;
      gap: 1px;
      justify-items: center;
      padding: 8px 7px;
      border-radius: 14px;
      color: var(--calendar-ink);
      background: var(--calendar-red-top);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
      font-weight: 900;
    }
    .date-badge small { font-size: .56rem; opacity: .92; text-transform: uppercase; letter-spacing: .08em; }
    .date-badge b { font-size: 1.16rem; line-height: 1; }
    .event-main { display: grid; gap: 8px; min-width: 0; }
    .event-main h2 { margin: 0; font-size: clamp(1.02rem, 4vw, 1.32rem); line-height: 1.1; color: var(--ink-strong); }
    .event-subline { color: var(--muted); line-height: 1.38; }
    .side-note { color: var(--muted); line-height: 1.38; font-weight: 650; }
    .event-subline { display: flex; gap: 6px; flex-wrap: wrap; font-size: .8rem; }
    .event-teaser { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.38; }
    .event-chevron { align-self: center; color: var(--gold); font-size: 1rem; font-weight: 900; transition: transform 0.16s ease; }
    .event-card[open] > summary .event-chevron { transform: rotate(180deg); }
    .event-body { display: grid; gap: 10px; padding: 0 12px 12px 75px; border-top: 1px solid var(--line); }
    .description { margin: 10px 0 0; font-size: .86rem; color: var(--ink); line-height: 1.38; }
    /* Public event notes: pulls optional bring/wayfinding fields from the data record so practical details stay with the event source. */
    .event-notes { display: grid; gap: 4px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--paper-soft) 78%, transparent); }
    .event-note { margin: 0; color: var(--ink); font-size: .82rem; line-height: 1.36; }
    .event-note strong { color: var(--ink-strong); }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 4px 7px; background: rgba(255,255,255,.07); }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .action { border: 1px solid var(--line); border-radius: 11px; padding: 8px 9px; background: var(--paper-soft); text-decoration: none; color: var(--ink); font-size: .82rem; }
    .action.primary { background: var(--blue-deep); border-color: var(--blue-deep); color: var(--blue-ink); font-weight: 800; }
    .empty { padding: 18px; border: 1px solid var(--line); border-radius: 17px; color: var(--muted); background: color-mix(in srgb, var(--paper) 90%, transparent); }
    /* Full-screen first: tablet/desktop use the available canvas instead of being trapped in the mobile shell. */
    .wrap { width: min(1120px, calc(100vw - 40px)); padding: 20px 0 96px; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .hero { border-radius: 28px; }
    .events-list { gap: 18px; }
    .time-group { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 14px; align-items: start; }
    .time-heading { grid-column: 1 / -1; }
    .event-card { border-radius: 24px; }
    .event-card > summary { grid-template-columns: 64px minmax(0,1fr) auto; padding: 14px; }
    .date-badge { min-width: 64px; min-height: 64px; border-radius: 19px; }
    .event-main { padding: 3px 2px; }
    .event-body { padding: 0 14px 14px 92px; }
    .actions { gap: 6px; }
    .action { border-radius: 14px; }
    @media (max-width: 720px) {
      .wrap { width: min(430px, 100vw); padding: 14px 14px 86px; }
      .top { align-items: center; margin-bottom: 12px; }
      .nav { display: none; }
      .hero { border-radius: 28px; padding: 16px; }
      .events-list { gap: 8px; }
      .time-group { grid-template-columns: 1fr; gap: 8px; }
      .event-card { border-radius: 22px; }
      .event-card > summary { grid-template-columns: 54px minmax(0,1fr) auto; padding: 9px; }
      .date-badge { min-width: 54px; min-height: 54px; border-radius: 17px; }
      .event-body { padding: 0 9px 9px 72px; }
    }
  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <div class="wrap">
    <!-- The hero owns page identity now; the top rail stays as light navigation
         utility without repeating the site wordmark in the corner. -->
    <header class="top">
      <nav class="nav" aria-label="Primary">
        <a class="pill" href="directory.html#search" id="events-find-places">Find places</a>
        <a class="pill" href="index.html" id="events-home-link">Home</a>
      </nav>
    </header>

    <section class="hero">
      <div class="eyebrow" id="events-hero-eyebrow">Community calendar</div>
      <h1 id="events-hero-title">What’s happening</h1>
      <p class="lede" id="events-hero-lede">Shows, meals, gatherings, pop-ups, and community dates around Acadie. Event cards link back to their host places so the calendar and directory stay connected.</p>
    </section>

    <div class="filters" aria-label="Event filters">
      <button class="pill active" data-filter="upcoming" id="filter-upcoming">Upcoming</button>
      <button class="pill" data-filter="all" id="filter-all">All</button>
      <button class="pill" data-filter="archive" id="filter-archive">Archive</button>
    </div>

    <main id="events" class="events-list" aria-live="polite"></main>
  </div>
  <script>
    // Events renderer: event cards are the primary public experience. Related
    // place/location context is visually separated and repeated inside cards only
    // where it helps the reader understand the event quickly.
    const state = { events: [], entries: [], locations: [], filter: 'upcoming' };
    const EVENTS_COPY = {
      en: {
        menuDirectory: 'View Everyone', menuAbout: 'About us', drawerTitle: 'Extras', drawerSubtitle: 'View Everyone, support, about us', pageTitle: 'ACADIE.SOL Events',
        heroEyebrow: 'Community calendar', heroTitle: 'What’s happening', heroLede: 'Shows, meals, gatherings, pop-ups, and community dates around Acadie. Event cards link back to their host places so the calendar and directory stay connected.',
        upcoming: 'Upcoming', all: 'All', archive: 'Archive', detailsSoon: 'Details coming soon.', previewSummary: 'Preview listing while the public calendar format is being shaped.',
        locationTbd: 'Location TBD', dateConfirm: 'Date to confirm', nextUp: 'Next up', comingUp: 'Coming up', later: 'Later', bring: 'Bring', where: 'Where',
        hostedBy: 'Hosted by', at: 'At', addToCalendar: 'Add to calendar', openEvent: 'Open event', viewHost: 'View host', noEvents: 'No matching events yet.', archiveLabel: 'Archive', loadFailed: 'Events failed to load:'
      },
      fr: {
        menuDirectory: 'Voir tout le monde', menuAbout: 'À propos de nous', drawerTitle: 'Extras', drawerSubtitle: 'Voir tout le monde, soutien, à propos de nous', pageTitle: 'ACADIE.SOL Événements',
        heroEyebrow: 'Calendrier communautaire', heroTitle: 'Ce qui se passe', heroLede: 'Spectacles, repas, rassemblements, pop-ups et dates communautaires autour de l’Acadie. Les fiches d’événements renvoient vers leurs lieux hôtes afin que le calendrier et le répertoire restent liés.',
        upcoming: 'À venir', all: 'Tous', archive: 'Archives', detailsSoon: 'Détails à venir.', previewSummary: 'Aperçu provisoire pendant que le format public du calendrier prend forme.',
        locationTbd: 'Lieu à confirmer', dateConfirm: 'Date à confirmer', nextUp: 'À venir', comingUp: 'Bientôt', later: 'Plus tard', bring: 'Apporter', where: 'Où',
        hostedBy: 'Animé par', at: 'À', addToCalendar: 'Ajouter au calendrier', openEvent: 'Ouvrir l’événement', viewHost: 'Voir l’hôte', noEvents: 'Aucun événement correspondant pour le moment.', archiveLabel: 'Archives', loadFailed: 'Échec du chargement des événements :'
      }
    };
    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }
    function copy() { return EVENTS_COPY[currentLang()] || EVENTS_COPY.en; }
    function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value; }
    function updateMenuControls() {
      document.documentElement.dataset.lang = currentLang();
      const isDark = document.documentElement.dataset.theme === 'dark';
      const themeButton = document.getElementById('theme-toggle');
      if (themeButton) {
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeButton.textContent = isDark ? '☼' : '☾';
        themeButton.setAttribute('aria-label', label);
        themeButton.setAttribute('title', label);
      }
      const langButton = document.getElementById('lang-toggle');
      if (langButton) {
        const isFr = currentLang() === 'fr';
        langButton.setAttribute('aria-label', isFr ? 'Switch language to English' : 'Switch language to French');
        langButton.setAttribute('title', isFr ? 'Français actif — passer en anglais' : 'English active — switch to French');
      }
    }
    function applyTheme(theme) { document.documentElement.dataset.theme = theme; localStorage.setItem('acadie-theme', theme); updateMenuControls(); }
    const savedTheme = localStorage.getItem('acadie-theme');
    if (savedTheme) applyTheme(savedTheme);
    function escapeHtml(str) { return String(str || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;'); }
    function text(value) {
      if (value && typeof value === 'object') {
        const lang = currentLang();
        return value[lang] || value.en || value.fr || value.shiac || '';
      }
      return value || '';
    }
    function publicTitle(event) { return String(text(event.title) || event.name || '').replace(/\s+Placeholder\b/i, ' Preview'); }
    function publicSummary(event) {
      const raw = String(text(event.summary) || copy().detailsSoon);
      return /placeholder|non-public/i.test(raw) ? copy().previewSummary : raw;
    }
    function parseDate(value) { const date = new Date(value || ''); return Number.isNaN(date.getTime()) ? null : date; }
    function dateParts(value) {
      const date = parseDate(value);
      if (!date) return { month: 'TBD', day: '', time: 'Time TBD', full: 'Date TBD' };
      return {
        month: new Intl.DateTimeFormat(currentLang(), { month: 'short' }).format(date),
        day: new Intl.DateTimeFormat(currentLang(), { day: 'numeric' }).format(date),
        time: new Intl.DateTimeFormat(currentLang(), { weekday: 'short', hour: 'numeric', minute: '2-digit' }).format(date),
        full: new Intl.DateTimeFormat(currentLang(), { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(date)
      };
    }
    function placeEntry(id) { return state.entries.find(item => item.slug === id); }
    function placeLocation(id) { return state.locations.find(item => item.id === id); }
    function entryName(id) { const entry = placeEntry(id); return text(entry?.title_localized) || entry?.title || id; }
    function locationName(id) { const location = placeLocation(id); return text(location?.title) || location?.name || copy().locationTbd; }
    function locationEntryId(id) { return placeLocation(id)?.entry_ids?.[0] || ''; }
    function fullEntryHref(slug) { return `entry.html#${encodeURIComponent(slug)}`; }
    function locationLink(id) {
      const name = locationName(id);
      const entryId = locationEntryId(id);
      return entryId ? `<a href="${fullEntryHref(entryId)}">${escapeHtml(name)}</a>` : escapeHtml(name);
    }
    function locationSummary(id) { return text(placeLocation(id)?.summary) || ''; }
    function eventHash(event) { return `event-${event.id}`; }
    function fullEventHref(event) { return `events.html#${encodeURIComponent(eventHash(event))}`; }
    function isArchived(event) { return event.computed_status === 'archived' || event.status === 'archived'; }
    function eventMatches(event) {
      if (state.filter === 'all') return true;
      if (state.filter === 'archive') return isArchived(event);
      return !isArchived(event);
    }
    function groupLabel(event) {
      const start = parseDate(event.starts_at);
      if (!start) return copy().dateConfirm;
      const now = new Date();
      const diffDays = Math.floor((start.setHours(0,0,0,0) - new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()) / 86400000);
      if (diffDays <= 7) return copy().nextUp;
      if (diffDays <= 31) return copy().comingUp;
      return copy().later;
    }
    function renderEvent(event) {
      const parts = dateParts(event.starts_at);
      const hosts = (event.host_entry_ids || []).map(id => `<a href="${fullEntryHref(id)}">${escapeHtml(entryName(id))}</a>`).join(', ');
      const icsHref = event.starts_at ? `assets/calendar/${encodeURIComponent(event.id)}.ics` : '';
      const bring = text(event.bring);
      const wayfinding = text(event.wayfinding);
      const summary = publicSummary(event);
      const teaser = summary.length > 120 ? `${summary.slice(0, 117).trimEnd()}…` : summary;
      const notes = [
        bring ? `<p class="event-note"><strong>${escapeHtml(copy().bring)}:</strong> ${escapeHtml(bring)}</p>` : '',
        wayfinding ? `<p class="event-note"><strong>${escapeHtml(copy().where)}:</strong> ${escapeHtml(wayfinding)}</p>` : ''
      ].filter(Boolean).join('');
      return `<details class="event-card" id="${escapeHtml(eventHash(event))}">
        <summary>
          <div class="date-badge"><small>${escapeHtml(parts.month)}</small><b>${escapeHtml(parts.day)}</b></div>
          <div class="event-main">
            <div>
              <h2>${escapeHtml(publicTitle(event))}</h2>
              <div class="event-subline">
                <span>${escapeHtml(parts.full)}</span>
                ${hosts ? `<span>${escapeHtml(copy().hostedBy)} ${hosts}</span>` : ''}
                <span>${escapeHtml(copy().at)} ${locationLink(event.location_id)}</span>
              </div>
            </div>
            <p class="event-teaser">${escapeHtml(teaser)}</p>
          </div>
          <span class="event-chevron" aria-hidden="true">▾</span>
        </summary>
        <div class="event-body">
          <p class="description">${escapeHtml(summary)}</p>
          ${notes ? `<div class="event-notes">${notes}</div>` : ''}
          <div class="actions">
            ${icsHref ? `<a class="action primary" href="${icsHref}" download>${escapeHtml(copy().addToCalendar)}</a>` : ''}
            <a class="action" href="${fullEventHref(event)}">${escapeHtml(copy().openEvent)}</a>
            ${event.host_entry_ids?.[0] ? `<a class="action" href="${fullEntryHref(event.host_entry_ids[0])}">${escapeHtml(copy().viewHost)}</a>` : ''}
          </div>
        </div>
      </details>`;
    }
    function safeHashFragment() {
      try { return decodeURIComponent(location.hash.slice(1)).trim(); }
      catch { return ''; }
    }
    function openHashTarget() {
      const id = safeHashFragment();
      if (!id) return;
      const target = document.getElementById(id);
      if (!(target instanceof HTMLDetailsElement)) return;
      target.open = true;
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function renderEvents() {
      const root = document.getElementById('events');
      const events = state.events.filter(eventMatches).sort((a, b) => String(a.starts_at || '').localeCompare(String(b.starts_at || '')));
      if (!events.length) {
        root.innerHTML = `<div class="empty">${escapeHtml(copy().noEvents)}</div>`;
        return;
      }
      const groups = new Map();
      events.forEach(event => {
        const label = state.filter === 'archive' ? copy().archiveLabel : groupLabel(event);
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(event);
      });
      root.innerHTML = [...groups.entries()].map(([label, items]) => `<section class="time-group"><h2 class="time-heading">${escapeHtml(label)}</h2>${items.map(renderEvent).join('')}</section>`).join('');
      openHashTarget();
    }
    function bindFilters() {
      document.querySelectorAll('[data-filter]').forEach(button => {
        button.addEventListener('click', () => {
          state.filter = button.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach(btn => btn.classList.toggle('active', btn === button));
          renderEvents();
        });
      });
    }
    function updateStaticCopy() {
      const c = copy();
      document.title = c.pageTitle;
      updateMenuControls();
      setText('events-hero-eyebrow', c.heroEyebrow);
      setText('events-hero-title', c.heroTitle);
      setText('events-hero-lede', c.heroLede);
      setText('events-find-places', c.findPlaces);
      setText('events-home-link', c.home);
      setText('filter-upcoming', c.upcoming);
      setText('filter-all', c.all);
      setText('filter-archive', c.archive);
    }
    window.addEventListener('acadie:languagechange', () => { updateStaticCopy(); renderEvents(); });
    document.documentElement.lang = currentLang();
    updateStaticCopy();
    window.addEventListener('hashchange', openHashTarget);
    Promise.all([
      fetch('assets/events-data.json', { cache: 'no-store' }).then(res => res.json()),
      fetch('assets/directory-data.json', { cache: 'no-store' }).then(res => res.json()),
      fetch('assets/locations-data.json', { cache: 'no-store' }).then(res => res.json())
    ]).then(([events, directory, locations]) => {
      state.events = events.items || [];
      state.entries = directory.items || [];
      state.locations = locations.items || [];
      bindFilters();
      renderEvents();
    }).catch(error => {
      document.getElementById('events').innerHTML = `<div class="empty">${escapeHtml(copy().loadFailed)} ${escapeHtml(error.message)}</div>`;
      console.error(error);
    });
  </script>
</body>
</html>
