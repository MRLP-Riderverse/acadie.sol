<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Shared identity metadata: use the same avatar for the desktop tab,
       homescreen install icon, and other PWA surfaces. -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#174b8e" />
  <title>Search · ACADIE.SOL</title>
  <link rel="stylesheet" href="assets/site-colors.css" />
  <style>
    /* search.html — first-class finding surface.
       The global dock opens this page directly; directory.html stays a browse
       surface, while this page owns cross-type search over the exported index. */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      color: var(--text);
      background: var(--page-bg);
      background-attachment: fixed;
      --search-controls-rest-bottom: 98px;
    }
    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--link-hover); }
    .wrap { width: min(760px, calc(100vw - 28px)); margin: 0 auto; padding: clamp(42px, 9svh, 92px) 0 120px; }

    /* Search surface — stable top-native layout.
       No bottom-lane tricks, no hero promotion state, no viewport choreography.
       The page starts with a normal search bar at the top and results directly below. */
    .search-hero {
      display: grid;
      align-items: start;
      text-align: left;
      padding: 0;
    }
    .search-surface {
      width: min(620px, 100%);
      display: grid;
      gap: 14px;
      align-content: start;
      justify-items: stretch;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .search-row { width: 100%; display: grid; gap: 12px; align-content: start; }
    .search-controls-shell { width: 100%; }
    .search-controls {
      width: min(620px, 100%);
      display: grid;
      gap: 8px;
      padding: 10px 12px 12px;
      background: var(--page-bg);
      border: 1px solid color-mix(in srgb, #000 32%, transparent);
      border-radius: 18px;
      box-shadow: 0 -6px 22px -4px var(--shadow);
      margin-inline: auto;
    }
    .search-field-wrap { position: relative; }
    .search-field {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line-strong) 78%, transparent);
      border-radius: 0;
      padding: 10px 34px 9px 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: clamp(1rem, 3.4vw, 1.15rem);
      font-weight: 750;
      text-align: left;
      outline: none;
      box-shadow: none;
    }
    .search-field::placeholder { color: color-mix(in srgb, var(--muted) 72%, transparent); }
    .search-field:focus-visible { outline: none; border-bottom-color: var(--gold); }
    .search-glyph { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--gold); font-weight: 900; font-size: 1rem; pointer-events: none; }
    .actions { display: flex; align-items: center; justify-content: flex-start; gap: 10px; flex-wrap: wrap; }
    .filter-menu { position: relative; }
    .filter-toggle,
    .chip,
    .view-all {
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--line) 68%, transparent);
      border-radius: 999px;
      padding: 9px 12px;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: .79rem;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      list-style: none;
    }
    .filter-toggle::-webkit-details-marker { display: none; }
    .chips {
      position: absolute;
      z-index: 4;
      top: calc(100% + 8px);
      left: 50%;
      width: min(390px, calc(100vw - 32px));
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      box-shadow: 0 16px 38px var(--shadow);
    }
    .filter-menu[open] .chips {
      position: absolute;
      top: calc(100% + 8px);
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
      width: min(390px, calc(100vw - 32px));
      display: flex !important;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      box-shadow: 0 16px 38px var(--shadow);
      z-index: 40;
    }
    .chip.active,
    .chip:hover,
    .filter-toggle:hover,
    .filter-menu[open] .filter-toggle,
    .view-all:hover { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
    .view-all { display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--blue-deep) 76%, transparent); border-color: transparent; color: var(--gold); }
    .count { width: 100%; min-height: 1.25em; color: var(--soft); font-size: .9rem; }

    /* Results appear only after the visitor asks for them. Fresh search.html stays
       clean so the page does not steer people before they type or choose a lens.
       Results use divider lines instead of container cards — more elegant for search.
       In active mode the results gain top padding so they start from a stable reading
       line below the fixed search chrome instead of appearing to bloom from center. */
    .results {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-top: 4px;
      text-align: left;
      width: 100%;
      padding-bottom: 24px;
    }
    .result-card {
      display: grid;
      gap: 6px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
      border-radius: 0;
      padding: 12px 2px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
    }
    .result-card:last-child { border-bottom: 0; }
    .result-card:hover { border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
    .result-top { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .result-title { margin: 0; color: var(--ink-strong); font-size: 1.08rem; line-height: 1.12; }
    .result-subtitle { color: var(--muted); font-size: .9rem; line-height: 1.35; }
    .type-pill { flex: 0 0 auto; border-radius: 999px; padding: 5px 8px; color: var(--gold); background: color-mix(in srgb, var(--blue-deep) 78%, transparent); font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { border-radius: 999px; padding: 5px 8px; color: var(--soft); background: transparent; border: 1px solid color-mix(in srgb, var(--line) 55%, transparent); font-size: .75rem; font-weight: 800; }
    .empty { border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); padding: 12px 2px; color: var(--muted); background: transparent; line-height: 1.45; }

    @media (max-width: 680px) {
      .wrap { width: min(430px, 100vw); padding: 22px 14px 120px; }
      .search-surface { gap: 16px; }
      .search-controls { width: min(390px, 100%); }
      .search-field { min-height: 44px; }
      .result-top { display: grid; }
      .type-pill { width: fit-content; }
    }
  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <main class="wrap">
    <section class="search-hero" aria-label="Acadie.sol search">
      <div class="search-surface">
        <h1 class="sr-only" id="search-title">Search Acadie.sol</h1>
        <div class="search-row">
          <div class="search-controls-shell">
            <div class="search-controls" id="search-controls">
              <div class="actions" aria-label="Search actions">
                <a class="view-all" href="directory.html" id="view-directory">View All</a>
                <details class="filter-menu" id="filter-menu">
                  <summary class="filter-toggle" id="filter-summary">Filters</summary>
                  <div class="chips" aria-label="Search filters">
                    <button class="chip active" type="button" data-filter="all" id="chip-all">All</button>
                    <button class="chip" type="button" data-filter="entry" id="chip-places">Places</button>
                    <button class="chip" type="button" data-filter="event" id="chip-events">Events</button>
                    <button class="chip" type="button" data-filter="food" id="chip-food">Food</button>
                    <button class="chip" type="button" data-filter="music" id="chip-music">Music</button>
                    <button class="chip" type="button" data-filter="family" id="chip-family">Family</button>
                    <button class="chip" type="button" data-filter="waterfront" id="chip-waterfront">Waterfront</button>
                  </div>
                </details>
                <span class="count" id="result-count"></span>
              </div>
              <label class="search-field-wrap" for="search-input">
                <input id="search-input" class="search-field" type="search" autocomplete="off" enterkeyhint="search" placeholder="?" aria-label="Search Acadie.sol" />
                <span class="search-glyph" aria-hidden="true">⌕</span>
              </label>
            </div>
          </div>
          <section class="results" id="results" aria-live="polite"></section>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SEARCH_COPY = {
      en: {
        title: 'Search Acadie.sol',
        placeholder: '?',
        filters: 'Filters', all: 'All', places: 'Places', events: 'Events', food: 'Food', music: 'Music', family: 'Family', waterfront: 'Waterfront', viewDirectory: 'View All',
        loading: '', ready: '',
        showing: count => `${count} result${count === 1 ? '' : 's'}.`,
        empty: 'No matches.',
      },
      fr: {
        title: 'Recherche Acadie.sol',
        placeholder: '?',
        filters: 'Filtres', all: 'Tout', places: 'Lieux', events: 'Événements', food: 'Repas', music: 'Musique', family: 'Famille', waterfront: 'Bord de l’eau', viewDirectory: 'Voir tout',
        loading: '', ready: '',
        showing: count => `${count} résultat${count === 1 ? '' : 's'}.`,
        empty: 'Aucun résultat.',
      }
    };

    const state = { items: [], query: '', filter: 'all' };
    let focusGuard = false;
    let touchStartY = null;
    function currentLang() { return window.AcadieShell?.currentLang?.() || document.documentElement.dataset.lang || 'en'; }
    function copy() { return SEARCH_COPY[currentLang()] || SEARCH_COPY.en; }
    function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value; }
    function escapeHtml(value) { return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;'); }
    function normalize(value) { return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

    function filterLabel() {
      const c = copy();
      const labels = { all: c.filters, entry: c.places, event: c.events, food: c.food, music: c.music, family: c.family, waterfront: c.waterfront };
      return labels[state.filter] || c.filters;
    }

    function applyCopy() {
      const c = copy();
      setText('search-title', c.title);
      setText('filter-summary', filterLabel());
      setText('chip-all', c.all); setText('chip-places', c.places); setText('chip-events', c.events);
      setText('chip-food', c.food); setText('chip-music', c.music); setText('chip-family', c.family); setText('chip-waterfront', c.waterfront);
      setText('view-directory', c.viewDirectory);
      const input = document.getElementById('search-input');
      input.placeholder = c.placeholder;
      input.setAttribute('aria-label', c.title);
      render();
    }

    function itemText(item) { return [item.title, item.subtitle, ...(item.badges || []), ...(item.terms || [])].map(normalize).join(' '); }
    function passesFilter(item) {
      if (state.filter === 'all') return true;
      if (state.filter === 'entry' || state.filter === 'event') return item.type === state.filter;
      return itemText(item).includes(normalize(state.filter));
    }
    function scoreItem(item, query) {
      if (!query) return item.type === 'event' ? 3 : 1;
      const title = normalize(item.title);
      const subtitle = normalize(item.subtitle);
      const haystack = itemText(item);
      let score = 0;
      if (title === query) score += 120;
      if (title.startsWith(query)) score += 80;
      if (title.includes(query)) score += 55;
      if (subtitle.includes(query)) score += 25;
      if ((item.badges || []).some(badge => normalize(badge).includes(query))) score += 20;
      if (haystack.includes(query)) score += 10;
      return score;
    }
    function resultUrl(item) {
      if (item.type === 'entry' && item.url && item.url.startsWith('directory.html#entry-')) {
        return item.url.replace('directory.html#entry-', 'entry.html#');
      }
      return item.url || 'directory.html';
    }
    function renderCard(item) {
      const typeLabel = item.type === 'event' ? copy().events : copy().places;
      const badges = (item.badges || []).slice(0, 4).map(badge => `<span class="badge">${escapeHtml(badge)}</span>`).join('');
      return `<a class="result-card" href="${escapeHtml(resultUrl(item))}">
        <div class="result-top"><div><h2 class="result-title">${escapeHtml(item.title)}</h2><div class="result-subtitle">${escapeHtml(item.subtitle || '')}</div></div><span class="type-pill">${escapeHtml(typeLabel)}</span></div>
        ${badges ? `<div class="badges">${badges}</div>` : ''}
      </a>`;
    }
    function render() {
      const c = copy();
      const query = normalize(state.query.trim());
      const hasIntent = Boolean(query) || state.filter !== 'all';
      if (!hasIntent) {
        setText('result-count', '');
        document.getElementById('results').innerHTML = '';
        return;
      }
      const ranked = state.items
        .filter(passesFilter)
        .map(item => ({ item, score: scoreItem(item, query) }))
        .filter(row => !query || row.score > 0)
        .sort((a, b) => b.score - a.score || String(a.item.title).localeCompare(String(b.item.title)))
        .slice(0, query ? 24 : 12)
        .map(row => row.item);
      setText('result-count', state.items.length ? (query || state.filter !== 'all' ? c.showing(ranked.length) : c.ready(state.items.length)) : c.loading);
      document.getElementById('results').innerHTML = ranked.length
        ? ranked.map(renderCard).join('')
        : `<div class="empty">${escapeHtml(c.empty)}</div>`;
    }

    function bindEvents() {
      const input = document.getElementById('search-input');
      input.addEventListener('input', event => {
        state.query = event.target.value;
        document.body.classList.add('search-input-focused');
        render();
      });
      input.addEventListener('focus', () => {
        document.body.classList.add('search-input-focused');
        render();
        focusGuard = true;
        setTimeout(() => { focusGuard = false; }, 150);
      });
      /* Enter key dismisses keyboard so results become visible. */
      input.addEventListener('blur', () => {
        touchStartY = null;
        document.body.classList.remove('search-input-focused');
        render();
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          input.blur();
        }
      });
      document.querySelectorAll('.chip').forEach(button => {
        button.addEventListener('click', () => {
          state.filter = button.dataset.filter || 'all';
          document.querySelectorAll('.chip').forEach(chip => chip.classList.toggle('active', chip === button));
          setText('filter-summary', filterLabel());
          document.getElementById('filter-menu')?.removeAttribute('open');
          render();
        });
      });
      /* Only a real touch-drag should dismiss the keyboard while editing.
         Window scroll deltas alone are too noisy on iPhone during keyboard resize. */
      window.addEventListener('touchstart', event => {
        if (document.activeElement?.id === 'search-input') {
          touchStartY = event.touches[0]?.clientY ?? null;
        }
      }, { passive: true });
      window.addEventListener('touchmove', event => {
        if (document.activeElement?.id !== 'search-input' || focusGuard || touchStartY === null) return;
        const currentTouchY = event.touches[0]?.clientY;
        if (typeof currentTouchY !== 'number') return;
        if (currentTouchY - touchStartY > 32) {
          input.blur();
          touchStartY = null;
        }
      }, { passive: true });
      window.addEventListener('touchend', () => {
        touchStartY = null;
      }, { passive: true });
      window.addEventListener('acadie:languagechange', applyCopy);
    }

    async function init() {
      applyCopy();
      bindEvents();
      const response = await fetch('assets/search-index.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Failed to load search index (${response.status})`);
      const payload = await response.json();
      state.items = Array.isArray(payload.items) ? payload.items : [];
      render();
    }
    init().catch(error => {
      console.error(error);
      document.getElementById('result-count').textContent = 'Search failed to load.';
      document.getElementById('results').innerHTML = '<div class="empty">Search failed to load. Please open the full directory.</div>';
    });
  </script>
</body>
</html>
