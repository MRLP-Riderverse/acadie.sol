<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obituaries — Acadie.sol</title>
  <style>
    :root {
      --bg: #f5efe5;
      --paper: #fffaf2;
      --ink: #2a231c;
      --muted: #6f6255;
      --line: rgba(95, 77, 56, .18);
      --gold: #d8a43b;
      --blue-deep: #22345d;
      --link: #254b7a;
      --link-hover: #143861;
      --shadow: rgba(65, 47, 29, 0.14);
      --glass: rgba(255,250,242,.68);
    }
    [data-theme="dark"] {
      --bg: #1e1a15;
      --paper: #2a2520;
      --ink: #f5ece1;
      --muted: #b4a799;
      --line: rgba(217, 200, 180, .15);
      --gold: #d9a321;
      --blue-deep: #3b578f;
      --link: #a9c3ff;
      --link-hover: #d8e4ff;
      --shadow: rgba(0, 0, 0, .35);
      --glass: rgba(41,36,31,.76);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 0%, rgba(216,155,32,.13), transparent 18rem),
        linear-gradient(180deg, var(--paper) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 80%, var(--gold)) 100%);
      color: var(--ink);
      font: 17px/1.45 "Trebuchet MS", "Verdana", sans-serif;
    }
    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:hover { color: var(--link-hover); }
    .menu-toggle { position: absolute; opacity: 0; pointer-events: none; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(26, 20, 16, .34); backdrop-filter: blur(5px) saturate(.92); -webkit-backdrop-filter: blur(5px) saturate(.92); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    .drawer { position: fixed; z-index: 21; left: 50%; bottom: 86px; width: min(390px, calc(100vw - 28px)); min-height: 218px; padding: 58px 14px 14px; border: 1px solid var(--line); border-radius: 26px; background: var(--glass); backdrop-filter: blur(20px) saturate(1.45); -webkit-backdrop-filter: blur(20px) saturate(1.45); box-shadow: 0 24px 54px var(--shadow); opacity: 0; pointer-events: none; transform: translate(-50%, 8px) scale(.98); transition: transform .18s ease, opacity .18s ease; }
    .menu-toggle:checked ~ .drawer-backdrop { opacity: 1; pointer-events: auto; }
    .menu-toggle:checked ~ .drawer { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
    .drawer-controls { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
    .menu-control, .drawer-close { min-width: 44px; min-height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--paper) 72%, transparent); color: var(--ink); font: inherit; font-weight: 900; text-decoration: none; cursor: pointer; pointer-events: auto; transition: background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
    .menu-control:focus, .drawer-close:focus { outline: none; }
    .menu-control:focus-visible, .drawer-close:focus-visible { outline: 2px solid color-mix(in srgb, var(--gold) 55%, transparent); outline-offset: 2px; }
    .theme-button { width: 44px; font-size: 1.15rem; line-height: 1; border-color: transparent; }
    :root:not([data-theme="dark"]) .theme-button { color: var(--gold); background: var(--blue-deep); }
    [data-theme="dark"] .theme-button { color: #111; background: var(--gold); }
    .lang-button { min-width: 84px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; letter-spacing: .06em; font-size: .72rem; font-family: system-ui, sans-serif; }
    .lang-button .lang-en, .lang-button .lang-fr { color: var(--muted); }
    [data-lang="en"] .lang-button .lang-en, [data-lang="fr"] .lang-button .lang-fr { color: #111; }
    .drawer-close { position: absolute; left: 50%; transform: translateX(-50%); width: 44px; color: var(--muted); font-size: 1.15rem; background: color-mix(in srgb, var(--paper) 84%, transparent); }
    .drawer-head { display: grid; gap: 2px; margin: 0 4px 18px; text-align: center; }
    .drawer-title { display: grid; gap: 2px; }
    .drawer-title strong { color: var(--blue-deep); text-transform: uppercase; letter-spacing: .08em; font-family: system-ui, sans-serif; }
    .drawer-title span { color: var(--muted); font-size: .8rem; font-family: system-ui, sans-serif; }
    .drawer-nav { display: grid; gap: 8px; margin-top: 22px; }
    .drawer-nav a { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 17px; background: color-mix(in srgb, var(--paper) 72%, transparent); color: var(--ink); text-decoration: none; font: inherit; font-family: system-ui, sans-serif; font-weight: 900; text-align: left; }
    .drawer-nav a:hover, .menu-control:hover, .drawer-close:hover { color: var(--ink); background: color-mix(in srgb, var(--paper) 90%, transparent); }
    .memorial {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 96px 20px 108px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .linkline {
      margin: 3.4rem 0 0;
      font-size: 1.18rem;
      letter-spacing: .02em;
    }
    .linkline a {
      display: inline-block;
      padding: 0.2rem 0.4rem;
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 5px;
    }
    .linkline a:hover { color: var(--link-hover); }
    .site-dock {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(390px, calc(100vw - 28px));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--glass);
      box-shadow: 0 14px 38px var(--shadow);
      backdrop-filter: blur(20px) saturate(1.45);
      z-index: 22;
    }
    .site-dock a, .site-dock label {
      display: grid;
      place-items: center;
      gap: 2px;
      min-height: 56px;
      padding: 8px 2px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--muted);
      font-size: .68rem;
      font-family: system-ui, sans-serif;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    @media (max-width: 720px) {
      .memorial { padding: 88px 16px 102px; }
      .drawer { width: min(430px, calc(100vw - 28px)); }
    }
  </style>
</head>
<body>
  <input class="menu-toggle" type="checkbox" id="menu-toggle" aria-hidden="true" />
  <label class="drawer-backdrop" for="menu-toggle" aria-label="Close menu"></label>
  <aside class="drawer" aria-label="Extras menu">
    <div class="drawer-controls" aria-label="Display and language controls">
      <button class="menu-control theme-button" type="button" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button>
      <a class="drawer-close" href="obituaries.html" aria-label="Open obituaries" title="Open obituaries">✟</a>
      <button class="menu-control lang-button" type="button" id="lang-toggle" aria-label="Switch language to French" title="English active — switch to French"><span class="lang-en">EN</span><span class="lang-sep">/</span><span class="lang-fr">FR</span></button>
    </div>
    <div class="drawer-head">
      <div class="drawer-title"><strong id="obituaries-drawer-title">Extras</strong><span id="obituaries-drawer-subtitle">Directory, about, display</span></div>
    </div>
    <nav class="drawer-nav">
      <a href="directory.html" id="obituaries-menu-directory">Full directory</a>
      <a href="index.html#about" id="obituaries-menu-about">About Acadie.sol</a>
    </nav>
  </aside>

  <main class="memorial" aria-labelledby="obituaries-title">
    <h1 id="obituaries-title">Lost but not forgotten</h1>
    <p class="linkline" id="obituaries-linkline"><a href="https://www.elhatton.com">Elhatton</a></p>
  </main>

    <nav class="site-dock" aria-label="Primary dock">
    <a href="index.html" aria-label="Home" title="Home"><span aria-hidden="true">⌂</span></a>
    <a href="events.html" aria-label="Events" title="Events"><span aria-hidden="true">◷</span></a>
    <a href="directory.html" aria-label="Search" title="Search"><span aria-hidden="true">⌕</span></a>
    <label for="menu-toggle" aria-label="Menu" title="Menu"><span aria-hidden="true">☰</span></label>
  </nav>

  <script>
    const COPY = {
      en: {
        title: 'Lost but not forgotten',
        drawerTitle: 'Extras',
        drawerSubtitle: 'Directory, about, display',
        directory: 'Full directory',
        about: 'About Acadie.sol',
        search: 'Search',
        menu: 'Menu',
      },
      fr: {
        title: 'On se souvient',
        drawerTitle: 'Extras',
        drawerSubtitle: 'Répertoire, à propos, affichage',
        directory: 'Répertoire',
        about: 'À propos d’Acadie.sol',
        search: 'Recherche',
        menu: 'Menu',
      },
    };

    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }

    function copy() { return COPY[currentLang()] || COPY.en; }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('acadie-theme', theme);
      updateMenuControls();
    }

    function updateMenuControls() {
      document.documentElement.dataset.lang = currentLang();
      const isDark = document.documentElement.dataset.theme === 'dark';
      const themeButton = document.getElementById('theme-toggle');
      if (themeButton) {
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeButton.textContent = isDark ? '☼' : '☾';
        themeButton.setAttribute('aria-label', label);
        themeButton.setAttribute('title', label);
      }
      const langButton = document.getElementById('lang-toggle');
      if (langButton) {
        const isFr = currentLang() === 'fr';
        langButton.setAttribute('aria-label', isFr ? 'Switch language to English' : 'Switch language to French');
        langButton.setAttribute('title', isFr ? 'Français actif — passer en anglais' : 'English active — switch to French');
      }
    }

    function renderCopy() {
      const c = copy();
      document.documentElement.lang = currentLang();
      document.title = `${c.title} — Acadie.sol`;
      updateMenuControls();
      document.getElementById('obituaries-title').textContent = c.title;
      document.getElementById('obituaries-drawer-title').textContent = c.drawerTitle;
      document.getElementById('obituaries-drawer-subtitle').textContent = c.drawerSubtitle;
      document.getElementById('obituaries-dock-home').textContent = c.home;
      document.getElementById('obituaries-dock-events').textContent = c.events;
      document.getElementById('obituaries-dock-search').textContent = c.search;
      document.getElementById('obituaries-dock-menu').textContent = c.menu;
      document.getElementById('obituaries-menu-directory').textContent = c.directory;
      document.getElementById('obituaries-menu-about').textContent = c.about;
    }

    document.getElementById('theme-toggle')?.addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    document.getElementById('lang-toggle')?.addEventListener('click', () => {
      const next = currentLang() === 'fr' ? 'en' : 'fr';
      localStorage.setItem('acadie-lang', next);
      renderCopy();
    });

    const savedTheme = localStorage.getItem('acadie-theme');
    if (savedTheme) applyTheme(savedTheme);
    renderCopy();
  </script>
</body>
</html>
