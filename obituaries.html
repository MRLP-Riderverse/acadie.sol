<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obituaries — Acadie.sol</title>
  <style>
    :root {
      --bg: #f5efe5;
      --paper: #fffaf2;
      --ink: #2a231c;
      --muted: #6f6255;
      --line: rgba(95, 77, 56, .18);
      --gold: #d8a43b;
      --blue-deep: #22345d;
      --link: #254b7a;
      --link-hover: #143861;
      --shadow: rgba(65, 47, 29, 0.14);
      --glass: rgba(255,250,242,.68);
    }
    [data-theme="dark"] {
      --bg: #1e1a15;
      --paper: #2a2520;
      --ink: #f5ece1;
      --muted: #b4a799;
      --line: rgba(217, 200, 180, .15);
      --gold: #d9a321;
      --blue-deep: #3b578f;
      --link: #a9c3ff;
      --link-hover: #d8e4ff;
      --shadow: rgba(0, 0, 0, .35);
      --glass: rgba(41,36,31,.76);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 0%, rgba(216,155,32,.13), transparent 18rem),
        linear-gradient(180deg, var(--paper) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 80%, var(--gold)) 100%);
      color: var(--ink);
      font: 17px/1.45 "Trebuchet MS", "Verdana", sans-serif;
    }
    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:hover { color: var(--link-hover); }
    .memorial {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 96px 20px 108px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .linkline {
      margin: 3.4rem 0 0;
      font-size: 1.18rem;
      letter-spacing: .02em;
    }
    .linkline a {
      display: inline-block;
      padding: 0.2rem 0.4rem;
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 5px;
    }
    .linkline a:hover { color: var(--link-hover); }
    @media (max-width: 720px) {
      .memorial { padding: 88px 16px 102px; }
    }
  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <main class="memorial" aria-labelledby="obituaries-title">
    <h1 id="obituaries-title">Lost but not forgotten</h1>
    <p class="linkline" id="obituaries-linkline"><a href="https://www.elhatton.com">Elhatton</a></p>
  </main>
  <script>
    const COPY = {
      en: {
        title: 'Lost but not forgotten',
        drawerTitle: 'Extras',
        drawerSubtitle: 'Directory, about, display',
        directory: 'Full directory',
        about: 'About Acadie.sol',
        search: 'Search',
        menu: 'Menu',
      },
      fr: {
        title: 'On se souvient',
        drawerTitle: 'Extras',
        drawerSubtitle: 'Répertoire, à propos, affichage',
        directory: 'Répertoire',
        about: 'À propos d’Acadie.sol',
        search: 'Recherche',
        menu: 'Menu',
      },
    };

    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }

    function copy() { return COPY[currentLang()] || COPY.en; }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('acadie-theme', theme);
      updateMenuControls();
    }

    function updateMenuControls() {
      document.documentElement.dataset.lang = currentLang();
      const isDark = document.documentElement.dataset.theme === 'dark';
      const themeButton = document.getElementById('theme-toggle');
      if (themeButton) {
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeButton.textContent = isDark ? '☼' : '☾';
        themeButton.setAttribute('aria-label', label);
        themeButton.setAttribute('title', label);
      }
      const langButton = document.getElementById('lang-toggle');
      if (langButton) {
        const isFr = currentLang() === 'fr';
        langButton.setAttribute('aria-label', isFr ? 'Switch language to English' : 'Switch language to French');
        langButton.setAttribute('title', isFr ? 'Français actif — passer en anglais' : 'English active — switch to French');
      }
    }

    function renderCopy() {
      const c = copy();
      document.documentElement.lang = currentLang();
      document.title = `${c.title} — Acadie.sol`;
      updateMenuControls();
      document.getElementById('obituaries-title').textContent = c.title;
    }

    window.addEventListener('acadie:languagechange', renderCopy);

    const savedTheme = localStorage.getItem('acadie-theme');
    if (savedTheme) applyTheme(savedTheme);
    renderCopy();
  </script>
</body>
</html>
