<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Shared identity metadata: use the same avatar for the desktop tab,
       homescreen install icon, and other PWA surfaces. -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#f5ede1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c1626" media="(prefers-color-scheme: dark)" />
  <title>Acadie.sol — Entry</title>
  <link rel="stylesheet" href="assets/site-colors.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page-bg);
      font-family: "Trebuchet MS", "Verdana", "Segoe UI", sans-serif;
    }
    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--link-hover); }
    .phone-shell { width: min(430px, 100vw); min-height: 100svh; margin: 0 auto; padding: 12px 12px 92px; display: grid; align-content: start; gap: 12px; }
    /* Full entry pages use the exported thumbnail as a square logo/thumb slot now,
       leaving room for future multi-photo gallery modules later without recropping
       the primary identity image into a poster panorama. */
    .poster { position: relative; width: min(240px, 100%); aspect-ratio: 1 / 1; margin: 0 auto; border-radius: 34px; overflow: hidden; box-shadow: 0 22px 48px var(--shadow); background: var(--blue-deep); display: grid; place-items: center; }
    .poster::before { content: ""; position: absolute; inset: 18px; border: 1px solid rgba(255,250,242,.24); border-radius: 27px; pointer-events: none; z-index: 2; }
    .poster-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .poster-initial { position: relative; z-index: 1; font-size: 4.5rem; font-weight: 900; color: color-mix(in srgb, var(--blue-ink) 88%, transparent); text-shadow: 0 4px 24px rgba(0,0,0,.24); }
    .surface { border: 1px solid var(--line); border-radius: 28px; background: color-mix(in srgb, var(--paper) 90%, transparent); box-shadow: 0 18px 42px var(--shadow); padding: 14px; }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; line-height: 1.1; }
    .entry-city { color: var(--muted); font-size: .82rem; margin-top: 4px; }
    .entry-category {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      color: var(--button-fg);
      font-size: .68rem;
      font-weight: 900;
      margin-top: 6px;
    }
    .entry-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .entry-tag { margin-top: 0; font-size: .66rem; }
    .description { margin: 0; font-size: .92rem; line-height: 1.42; color: var(--ink); }
    .entry-note-list { margin: 10px 0 0; padding-left: 1.15rem; display: grid; gap: 5px; color: var(--ink); font-size: .88rem; line-height: 1.4; }
    .entry-note-list li::marker { color: var(--red); }
    h1 { text-shadow: 2px 0 0 rgba(218, 38, 54, .72), -2px 0 0 rgba(47, 116, 180, .62); }
    .detail-grid { display: grid; gap: 8px; margin-top: 12px; }
    .detail-row { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .detail-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 900; white-space: nowrap; text-align: right; }
    .detail-value { font-size: .88rem; word-break: break-word; }
    .hours-stack { display: grid; gap: 3px; width: 100%; }
    .hours-day { display: grid; grid-template-columns: minmax(82px, 1fr) 1.35fr; gap: 10px; padding: 2px 0; line-height: 1.35; }
    .hours-day-name { color: var(--muted); font-weight: 800; }
    .hours-day-value { color: var(--ink); }
    .hours-day-value.is-closed { color: var(--muted); font-style: italic; }
    .detail-link { color: var(--link); text-decoration: underline; text-underline-offset: 2px; font-weight: 800; }
    .section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .11em; color: var(--muted); font-weight: 900; margin-top: 12px; margin-bottom: 6px; }
    .event-row { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper-soft); text-decoration: none; margin-top: 6px; }
    .date-chip { width: 46px; min-height: 46px; border-radius: 15px; background: var(--calendar-badge-bg); color: var(--calendar-ink); display: grid; place-items: center; text-align: center; font-weight: 900; line-height: 1; font-size: .78rem; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); border: 1px solid var(--red); }
    .date-chip small { display: block; font-size: .56rem; opacity: .92; text-transform: uppercase; letter-spacing: .08em; }
    .event-row strong { display: block; font-size: .88rem; }
    .event-row span { display: block; color: var(--muted); font-size: .75rem; }
    .related-place { display: inline-flex; align-items: center; padding: 6px 12px; border: 1px solid var(--button-border); border-radius: 14px; background: var(--button-bg); color: var(--button-fg); text-decoration: none; font-size: .82rem; font-weight: 900; margin: 4px 4px 4px 0; }
    .empty-msg { padding: 28px; text-align: center; color: var(--muted); }
    .page-footer { padding: 16px 4px 0; color: var(--muted); font-size: .82rem; line-height: 1.45; border-top: 1px solid var(--line); margin-top: 4px; }
    .page-footer p { margin: 0; }

  </style>
  <link rel="stylesheet" href="assets/site-shell.css" />
</head>
<body>
  <script src="assets/site-shell.js"></script>
  <main class="phone-shell" id="entry-root">
    <div class="empty-msg" id="loading">Loading entry…</div>
  </main>
  <script>
    /* entry.html — MySpace-style single-template data-driven page.
       Reads slug from URL hash (#slug), fetches directory-data.json,
       and renders a full page for that entry. Drafts redirect back
       to directory.html since they don't get full pages yet. */
    function currentLang() {
      const saved = localStorage.getItem('acadie-lang');
      if (saved === 'fr' || saved === 'en') return saved;
      return /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
    }
    const ENTRY_COPY = {
      en: { loading: 'Loading entry…', notFound: 'Entry not found', noMatch: 'No entry matches', back: 'Back to directory', hours: 'Hours', address: 'Address', phone: 'Phone', email: 'Email', website: 'Website', relatedEvents: 'Related events', relatedPlaces: 'Related places', loadFailed: "Couldn't load entry" },
      fr: { loading: 'Chargement de la fiche…', notFound: 'Fiche introuvable', noMatch: 'Aucune fiche ne correspond à', back: 'Retour au répertoire', hours: 'Heures', address: 'Adresse', phone: 'Téléphone', email: 'Courriel', website: 'Site web', relatedEvents: 'Événements liés', relatedPlaces: 'Lieux liés', loadFailed: 'Impossible de charger la fiche' }
    };
    function copy() { return ENTRY_COPY[currentLang()] || ENTRY_COPY.en; }
    function escapeHtml(str) { const d=document.createElement("div"); d.textContent=String(str||""); return d.innerHTML; }
    // Keep authored Markdown links intact as safe, readable outbound links.
    function renderInlineMarkdown(value) {
      const escaped = escapeHtml(value);
      const linked = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) => `<a class="detail-link" href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
      return linked.split(/(<[^>]+>)/g).map(part => part.startsWith('<') ? part : part.replace(/\b(MRLP\.Acadie\.sol|Acadie\.sol)\b/g, name => `<a class="detail-link" href="entry.html#${name === 'Acadie.sol' ? 'acadie-sol' : 'mrlp-acadie-sol'}">${name}</a>`)).join('');
    }
    function normalize(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
    function cleanSummary(v) {
      if (v && typeof v === 'object') {
        const lang = currentLang();
        return v[lang] || v.en || v.fr || v.shiac || '';
      }
      return v || '';
    }
    function localized(v) { return cleanSummary(v); }
    // Localized bullet arrays are separate from localized prose fields.
    // English fallback preserves legacy records until their French notes land.
    function localizedList(value) {
      if (!value || typeof value !== 'object') return [];
      const lang = currentLang();
      return Array.isArray(value[lang]) && value[lang].length
        ? value[lang]
        : (Array.isArray(value.en) ? value.en : []);
    }
    function localizedHoursText(value) {
      const text = cleanSummary(value);
      if (currentLang() !== 'fr') return text;
      if (/^closed$/i.test(text)) return 'Fermé';
      return ({ Monday: 'lundi', Tuesday: 'mardi', Wednesday: 'mercredi', Thursday: 'jeudi', Friday: 'vendredi', Saturday: 'samedi', Sunday: 'dimanche' })[text] || text;
    }
    function contactValue(item, key) { return (item.contact && item.contact[key]) || item[key] || ''; }
    function contactValues(item) {
      return ['address', 'hours', 'phone', 'email', 'website']
        .map(key => contactValue(item, key))
        .map(value => cleanSummary(value).trim())
        .filter(Boolean);
    }
    function publicDataRows(item) {
      const seen = new Set(contactValues(item));
      ['facebook', 'instagram', 'x'].forEach(key => {
        const value = cleanSummary(contactValue(item, key)).trim();
        if (value) seen.add(value);
      });
      return (Array.isArray(item.public_data) ? item.public_data : []).map(value => {
        const text = cleanSummary(value); const split = text.indexOf(':');
        const label = split > 0 ? text.slice(0, split).trim() : 'Public';
        const content = split > 0 ? text.slice(split + 1).trim() : text;
        return [label.toLowerCase(), label, content];
      }).filter(([, , value]) => {
        const normalized = value.trim();
        if (!normalized || seen.has(normalized)) return false;
        seen.add(normalized);
        return true;
      });
    }
    function publicCity(item) { const d = String(item.public_area || '').trim(); if (d) return d; const a = String(item.area || '').trim(); if (/bathurst/i.test(a)) return 'Acadie-Bathurst'; return a || ''; }
    function mapsHref(v) { const q = encodeURIComponent(cleanSummary(v)); return q ? `https://www.google.com/maps/search/?api=1&query=${q}` : ''; }
    function phoneHref(v) { const d = cleanSummary(v).replace(/[^\d+]/g, ''); return d ? `tel:${d}` : ''; }
    function safeImageSrc(value) {
      const raw = String(value || '').trim();
      if (!raw || raw.startsWith('//')) return '';
      try {
        const url = new URL(raw, document.baseURI);
        return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '';
      } catch {
        return '';
      }
    }
    function renderDetailLink(label, value) {
      const text = cleanSummary(value); if (!text) return '';
      const lower = String(label || '').toLowerCase();
      if (lower === 'phone') { const h = phoneHref(text); return h ? `<a class="detail-link" href="${h}">${escapeHtml(text)}</a>` : escapeHtml(text); }
      if (lower === 'address') { const h = mapsHref(text); return h ? `<a class="detail-link" href="${h}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>` : escapeHtml(text); }
      if (lower === 'email') return `<a class="detail-link" href="mailto:${encodeURIComponent(text)}">${escapeHtml(text)}</a>`;
      if (lower === 'website' || /^https?:\/\//i.test(text)) { const h = /^https?:\/\//i.test(text) ? text : `https://${text}`; return `<a class="detail-link" href="${escapeHtml(h)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`; }
      if ((lower === 'instagram' || lower === 'x' || lower === 'twitter') && /^@?[a-z0-9._]+$/i.test(text)) {
        const handle = text.replace(/^@/, ''); const host = lower === 'instagram' ? 'instagram.com' : 'x.com';
        return `<a class="detail-link" href="https://${host}/${encodeURIComponent(handle)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`;
      }
      return escapeHtml(text);
    }
    function renderHoursValue(value, schedule) {
      if (!Array.isArray(schedule) || !schedule.length) return renderDetailLink('Hours', value);
      return `<div class="hours-stack" aria-label="Hours by day">${schedule.map(row => {
        const day = localizedHoursText(row.day || '');
        const hours = localizedHoursText(row.hours || '');
        const closed = /^closed$/i.test(String(row.hours || '').trim());
        return `<div class="hours-day"><span class="hours-day-name">${escapeHtml(day)}</span><span class="hours-day-value${closed ? ' is-closed' : ''}">${escapeHtml(hours)}</span></div>`;
      }).join('')}</div>`;
    }
    function renderNoteList(item, notes) {
      const points = localizedList(item.note_points_localized);
      const legacyPoints = Array.isArray(item.note_points) && item.note_points.length
        ? item.note_points
        : String(notes || '').split(/\s+-\s+/).map(point => point.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      const visiblePoints = points.length ? points : legacyPoints;
      return visiblePoints.length ? `<ul class="entry-note-list">${visiblePoints.map(point => `<li>${renderInlineMarkdown(point)}</li>`).join('')}</ul>` : '';
    }
    function dateParts(value) { const d = new Date(value || ''); if (Number.isNaN(d.getTime())) return { month: 'TBD', day: '' }; return { month: new Intl.DateTimeFormat(currentLang(), { month: 'short' }).format(d), day: new Intl.DateTimeFormat(currentLang(), { day: 'numeric' }).format(d) }; }
    function applyTheme(theme) { document.documentElement.dataset.theme = theme; localStorage.setItem('acadie-theme', theme); }
    const savedTheme = localStorage.getItem('acadie-theme');
    if (savedTheme) applyTheme(savedTheme);
    function updateChromeCopy() {
      document.documentElement.lang = currentLang();
      document.getElementById('loading')?.replaceChildren(document.createTextNode(copy().loading));
      window.AcadieShell?.sync?.();
    }
    window.addEventListener('acadie:languagechange', () => { updateChromeCopy(); render(); });
    document.documentElement.lang = currentLang();
    updateChromeCopy();

    function safeHashFragment() {
      try { return decodeURIComponent(location.hash.slice(1)).trim(); }
      catch { return ''; }
    }
    const slug = safeHashFragment();
    if (!slug) { location.replace('directory.html#browse'); }

    async function render() {
      const root = document.getElementById('entry-root');
      try {
        const [dirRes, evtRes] = await Promise.all([
          fetch('assets/directory-data.json', { cache: 'no-store' }),
          fetch('assets/events-data.json', { cache: 'no-store' })
        ]);
        const dirData = await dirRes.json();
        const evtData = await evtRes.json();
        const items = dirData.items || [];
        const events = evtData.items || [];
        const item = items.find(i => i.slug === slug);
        if (!item) {
          root.innerHTML = `<div class="empty-msg"><h1>${escapeHtml(copy().notFound)}</h1><p>${escapeHtml(copy().noMatch)} <code>${escapeHtml(slug)}</code>.</p><p><a href="directory.html#browse">${escapeHtml(copy().back)}</a></p></div>`;
          return;
        }
        // Drafts don't get full pages — redirect to expanded card
        if (item.draft) { location.replace(`directory.html#entry-${encodeURIComponent(item.slug)}`); return; }

        const itemTitle = localized(item.title_localized) || item.title || 'Entry';
        document.title = `${itemTitle} — Acadie.sol`;
        const city = publicCity(item);
        const description = localized(item.description_localized) || cleanSummary(item.description || item.summary);
        const notes = localized(item.notes_localized) || cleanSummary(item.notes);
        const detailRows = [
          ['hours', copy().hours, contactValue(item, 'hours')],
          ['address', copy().address, contactValue(item, 'address')],
          ['phone', copy().phone, contactValue(item, 'phone')],
          ['email', copy().email, contactValue(item, 'email')],
          ['website', copy().website, contactValue(item, 'website')],
          ...publicDataRows(item).map(([type, label, value]) => [type, label, value]),
        ].filter(([, , value]) => cleanSummary(value));

        // Related events
        const relatedEvents = events.filter(e => {
          const byEntry = [...(e.host_entry_ids || []), ...(e.performer_entry_ids || []), ...(e.sponsor_entry_ids || [])].includes(item.slug);
          const byLoc = item.location_id && e.location_id === item.location_id;
          return byEntry || byLoc;
        }).sort((a, b) => String(a.starts_at || '').localeCompare(String(b.starts_at || '')));

        // Related places (share same location or cross-referenced)
        const relatedSlugs = new Set([...(item.related_places || [])].map(s => normalize(s)));
        const relatedPlaces = items.filter(i => i.slug !== item.slug && !i.draft && (relatedSlugs.has(normalize(i.slug)) || (item.location_id && i.location_id === item.location_id))).slice(0, 6);

        const eventsHtml = relatedEvents.length ? `
          <div class="section-label">${escapeHtml(copy().relatedEvents)}</div>
          ${relatedEvents.map(e => {
            const p = dateParts(e.starts_at);
            const title = String(localized(e.title) || e.name || '').replace(/\s+Placeholder\b/i, ' Preview');
            return `<a class="event-row" href="events.html#event-${escapeHtml(e.id)}"><span class="date-chip"><small>${escapeHtml(p.month)}</small>${escapeHtml(p.day)}</span><div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(e.computed_status || '')}</span></div></a>`;
          }).join('')}
        ` : '';

        const placesHtml = relatedPlaces.length ? `
          <div class="section-label">${escapeHtml(copy().relatedPlaces)}</div>
          <div>${relatedPlaces.map(p => `<a class="related-place" href="entry.html#${escapeHtml(p.slug)}">${escapeHtml(cleanSummary(p.title_localized) || p.title)}</a>`).join('')}</div>
        ` : '';

        const initial = (itemTitle || '?').trim().charAt(0).toUpperCase();
        const thumbnailSrc = safeImageSrc(item.thumbnail_src);
        const thumbnailAlt = String(item.thumbnail_alt || itemTitle || 'Entry photo').trim();

        root.innerHTML = `
          <section class="poster">${thumbnailSrc ? `<img class="poster-image" src="${escapeHtml(thumbnailSrc)}" alt="${escapeHtml(thumbnailAlt)}" />` : `<span class="poster-initial">${escapeHtml(initial)}</span>`}</section>
          <section class="surface">
            <h1>${escapeHtml(itemTitle)}</h1>
            ${city ? `<div class="entry-city">${escapeHtml(city)}</div>` : ''}
            ${description ? `<p class="description" style="margin-top:10px">${renderInlineMarkdown(description)}</p>` : ''}
            ${renderNoteList(item, notes)}
            ${detailRows.length ? `<div class="detail-grid">${detailRows.map(([type, label, value]) => `<div class="detail-row"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value">${type === 'hours' ? renderHoursValue(value, item.hours_schedule) : renderDetailLink(type, value)}</div></div>`).join('')}</div>` : ''}
          </section>
          ${eventsHtml || placesHtml ? `<section class="surface">${eventsHtml}${placesHtml}</section>` : ''}
          <footer class="page-footer"><p><a href="directory.html#browse">${escapeHtml(copy().back)}</a></p></footer>
        `;
      } catch (err) {
        root.innerHTML = `<div class="empty-msg"><h1>${escapeHtml(copy().loadFailed)}</h1><p>${escapeHtml(err.message)}</p></div>`;
      }
    }
    render();
  </script>
</body>
</html>
